    if(m==='goddess'){
      h += '<div class="card" style="border-color:var(--gold)"><b>Il finale è tuo</b><p class="note" style="margin:6px 0">Scegli come si conclude la partita.</p><div class="list">'+
        (s.settings.finalOptions||[]).map(function(f,i){ return '<button class="opt" data-g="finpick" data-i="'+i+'">'+esc(f)+'</button>'; }).join('')+'</div></div>';
    } else h += '<p class="note" style="text-align:center;margin-top:12px">Attendi la decisione finale della Dea.</p>';
  }
  if(s.gameStatus==='terminata'){
    const t = gStats(s);
    h += '<div class="card" style="border-color:var(--gold)"><div class="txt" style="font-size:16px">'+(s.endReason==='finale' ? 'Finale: '+esc(s.finale||'') : 'Chiusa per '+esc(s.endReason||'scelta'))+
      '<br>Turni '+t.turni+' · completate '+t.completate+' · saltate '+t.saltate+' · '+t.minuti+' min</div></div>';
    if(m==='goddess'){
      h += '<div class="row2">'+(s.endReason!=='finale' ? '<button class="btn ghost" data-g="restore">Ripristina</button>' : '')+'<button class="btn" data-g="newsetup">Nuova partita</button></div>';
    }
  }
  /* menu */
  const b = [];
  if(s.gameStatus==='attiva') b.push(['pause','⏸ Pausa']);
  if(s.gameStatus==='pausa' && (m==='goddess' || s.pausedBy===m)) b.push(['resume','▶ Riprendi']);
  if(gCanUndo(s) && (m===s.currentTurn || m==='goddess')) b.push(['undo','↩ Annulla ultimo tiro']);
  if(m==='goddess' && s.currentChallenge && s.gameStatus==='attiva') b.push(['skipsq','⏭ Salta la casella']);
  b.push(['panel:regole','Regole']); b.push(['panel:storico','Storico']); b.push(['panel:stat','Statistiche']);
  if(m==='goddess') b.push(['panel:imp','Impostazioni e prove']);
  if(s.gameStatus!=='terminata') b.push(['panel:term','Termina']);
  h += '<div class="gmenu">'+b.map(function(x){
    const p = x[0].split(':');
    return p[0]==='panel' ? '<button class="chip2" data-g="panel" data-p="'+p[1]+'">'+x[1]+'</button>' : '<button class="chip2" data-g="'+p[0]+'">'+x[1]+'</button>';
  }).join('')+'</div>';
  return h;
}

function gModalHtml(s){
  const ch = s && s.currentChallenge;
  if(!ch || !gModalOpen || s.gameStatus!=='attiva' || gForceSetup) return '';
  const c = GCAT[ch.category] || GCAT.vuota, m = gMe();
  let h = '<div class="gmodal"><div class="gsheet" style="border-color:'+c.c+'">';
  h += '<div class="gsh1"><span class="gsi" style="background:'+c.c+'33;color:'+c.c+'">'+c.i+'</span><div><div class="gsc">'+esc(c.n)+(ch.squareName ? ' · '+esc(ch.squareName) : '')+'</div>'+
    '<div class="muted">Casella '+ch.square+' · ha tirato '+gWho(ch.roller)+' · '+esc(G_MODES[ch.mode].nome)+'</div></div></div>';
  h += '<div class="gst">'+esc(ch.title)+'</div>';
  if(gEditing && m==='goddess'){
    h += '<textarea id="gedit" rows="4">'+esc(ch.description)+'</textarea><div class="row2"><button class="btn" data-g="saveedit">Salva</button><button class="btn ghost" data-g="canceledit">Annulla</button></div>';
  } else h += '<p class="gsd">'+esc(ch.description)+'</p>';
  const meta = [];
  if(ch.difficulty) meta.push('Intensità '+'●'.repeat(ch.difficulty)+'○'.repeat(Math.max(0,5-ch.difficulty)));
  if(ch.duration) meta.push('circa '+ch.duration+' min');
  meta.push('Stato: '+ch.status);
  h += '<p class="note">'+meta.join(' · ')+'</p>';
  if(ch.physical) h += '<p class="note" style="color:var(--rose)">Pratica di sensazione: serve il «Concordo» di entrambi. «Cambia» propone una versione più leggera.<br>Dea '+(ch.agree.goddess ? '✓' : '✗')+' · Schiavo '+(ch.agree.slave ? '✓' : '✗')+'</p>';
  else if(!ch.system) h += '<p class="note">Conferme: Dea '+(ch.agree.goddess ? '✓' : '·')+' · Schiavo '+(ch.agree.slave ? '✓' : '·')+'</p>';
  if(gRuleOpen) h += '<div class="card" style="margin-top:6px"><div class="txt" style="font-size:15px">'+esc(G_MODES[ch.mode].rule)+'<br><br>Condizione di completamento: '+esc(ch.criteria||'')+'<br><br>'+esc(G_RULES)+'</div></div>';
  const mine = ch.agree[m];
  h += '<div class="gbtns">';
  if(!ch.system) h += '<button class="btn ghost" data-g="agree">'+(mine ? '✓ ' : '')+(ch.physical ? 'Concordo' : 'Conferma')+'</button>';
  h += '<button class="btn" data-g="complete"'+(ch.physical && !(ch.agree.goddess && ch.agree.slave) ? ' disabled' : '')+'>'+
    (ch.system ? 'Avanti' : ch.money ? 'Pagamento fatto (conferma manuale)' : 'Completata')+'</button>';
  if(!ch.system) h += '<button class="btn ghost" data-g="skip">'+(ch.money ? 'Rifiuta' : 'Sospendi o salta')+'</button>';
  if(!ch.system && ch.category!=='arrivo') h += '<button class="btn ghost" data-g="change">Cambia</button>';
  h += '<button class="btn ghost" data-g="rule">'+(gRuleOpen ? 'Nascondi regola' : 'Limite e regola')+'</button>';
  if(m==='goddess' && !ch.system){
    h += '<button class="btn ghost" data-g="edit">Modifica testo</button>';
    if(ch.order && ch.roller==='goddess' && !ch.ordered) h += '<button class="btn ghost" data-g="gorder">Invia come ordine</button>';
  }
  h += '<button class="link" data-g="closemodal">Chiudi la scheda</button></div></div></div>';
  return h;
}

function gBuildBoard(mode){
  const b = gEl.querySelector('#gBoard'), cats = gBoardOf(mode);
  let h = '';
  for(let r=0; r<8; r++){
    for(let c=0; c<5; c++){
      const n = r%2===0 ? r*5+c+1 : r*5+(5-c);
      const k = GCAT[cats[n-1]] || GCAT.vuota;
      const special = G_NAMES[n] ? ' sp' : '';
      const ico = n===1 ? '▶' : n===40 ? '🏁' : k.i;
      h += '<div class="gc'+special+'" data-sq="'+n+'" style="border-color:'+k.c+';background-color:'+k.c+'22" title="'+esc(k.n)+'"><span class="gn">'+n+'</span>'+
        (G_NAMES[n] && n!==1 && n!==40 ? '<span class="gstar">★</span>' : '')+'<span class="gi">'+ico+'</span></div>';
    }
  }
  b.innerHTML = h + '<div class="gtok g" id="tokG"><span class="gti">'+ic('crown')+'</span></div><div class="gtok s" id="tokS"><span class="gti">'+ic('lock')+'</span></div>';
  gBoardMode = mode; gPlacedOnce = false;
}
function gSleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function gXY(n, off){
  const b = gEl.querySelector('#gBoard'), cell = b.querySelector('[data-sq="'+n+'"]'), tok = b.querySelector('#tokG');
  if(!cell || !tok) return null;
  const tw = tok.offsetWidth || 28;
  return {x: cell.offsetLeft + (cell.offsetWidth - tw)/2 + (off||0)*tw*0.55, y: cell.offsetTop + (cell.offsetHeight - tw)/2};
}
function gMoveTok(who, n, off, ms){
  const b = gEl.querySelector('#gBoard'), tok = b.querySelector(who==='goddess' ? '#tokG' : '#tokS'), p = gXY(n, off);
  if(!tok || !p) return;
  tok.style.transitionDuration = (ms||0)+'ms';
  tok.style.transform = 'translate('+p.x+'px,'+p.y+'px)';
  if(!ms){ void tok.offsetWidth; }
}
function gMarkCells(s){
  const b = gEl.querySelector('#gBoard');
  Array.prototype.forEach.call(b.querySelectorAll('.gc.hg,.gc.hs'), function(c){ c.classList.remove('hg','hs'); });
  const cg = b.querySelector('[data-sq="'+s.goddessPosition+'"]'), cs = b.querySelector('[data-sq="'+s.slavePosition+'"]');
  if(cg) cg.classList.add('hg');
  if(cs) cs.classList.add('hs');
  const tg = b.querySelector('#tokG'), ts = b.querySelector('#tokS'), act = s.gameStatus==='attiva';
  if(tg) tg.classList.toggle('act', act && s.currentTurn==='goddess');
  if(ts) ts.classList.toggle('act', act && s.currentTurn==='slave');
}
function gPlaceNow(s, ms){
  const same = s.goddessPosition===s.slavePosition;
  gMoveTok('goddess', s.goddessPosition, same ? -1 : 0, ms);
  gMoveTok('slave', s.slavePosition, same ? 1 : 0, ms);
  gMarkCells(s);
}
function gPathSteps(from, die){
  const p = []; let pos = from, dir = 1;
  for(let i=0; i<die; i++){
    pos += dir;
    if(pos===G_SIZE && i<die-1) dir = -1;
    p.push(pos);
  }
  return p;
}
function gLandFx(n){
  const c = gEl && gEl.querySelector('[data-sq="'+n+'"]');
  if(!c) return;
  c.classList.add('land');
  setTimeout(function(){ c.classList.remove('land'); }, 1000);
  try{ if(navigator.vibrate) navigator.vibrate(35); }catch(e){}
}
async function gAnimateRoll(s){
  const h = s.turnHistory[s.turnHistory.length-1];
  if(!h){ gPlaceNow(s, 0); return; }
  gAnimating = true;
  const md = gEl.querySelector('#gModal'); if(md) md.innerHTML = '';
  if(h.who!==gMe()){ toast((h.who==='goddess' ? 'La Dea' : 'Lo schiavo')+' ha tirato: '+h.die); buzz(); }
  const tok = gEl.querySelector(h.who==='goddess' ? '#tokG' : '#tokS');
  try{
    const steps = gPathSteps(h.from, h.die);
    for(let i=0; i<steps.length; i++){
      gMoveTok(h.who, steps[i], 0, 150);
      if(tok){ tok.classList.add('hop'); setTimeout(function(){ tok.classList.remove('hop'); }, 170); }
      await gSleep(170);
    }
    gLandFx(h.square);
    await gSleep(260);
    const cur = G ? G.stato : s;
    gPlaceNow(cur, 460);
    await gSleep(h.to!==h.square || h.note==='scambio' ? 520 : 120);
  } finally {
    gAnimating = false;
    gameRender();
  }
}
function gPlaceTokens(animate){
  if(!gEl || !G || !gOpen || gAnimating) return;
  const b = gEl.querySelector('#gBoard');
  if(!b || !b.offsetWidth) return;
  const s = G.stato, hl = s.turnHistory.length;
  if(!gPlacedOnce || !animate){ gPlaceNow(s, 0); gHistSeen = hl; gPlacedOnce = true; return; }
  if(hl > gHistSeen){ gHistSeen = hl; gAnimateRoll(s); return; }
  gHistSeen = hl;
  gPlaceNow(s, 450);
}
function gCellInfo(n){
  if(!G) return;
  const cat = gBoardOf(G.stato.mode)[n-1], k = GCAT[cat] || GCAT.vuota;
  toast(n+' · '+(G_NAMES[n] || k.n)+' — '+G_DESC[cat]);
}

function gameRender(){
  if(!gEl) return;
  gEl.classList.toggle('open', gOpen);
  const s = G && G.stato;
  gEl.querySelector('#gHint').innerHTML = gHint(s);
  if(s && s.currentChallenge && s.currentChallenge.id!==gSeenCh){ gSeenCh = s.currentChallenge.id; gModalOpen = true; gRuleOpen = false; gEditing = false; }
  gFabUpdate();
  if(!gOpen) return;
  gEl.querySelector('#gTop').innerHTML = gTopHtml(s);
  const showBoard = !!s && !gErr && !(gForceSetup && role==='padrona');
  const bd = gEl.querySelector('#gBoard');
  bd.style.display = showBoard ? '' : 'none';
  if(showBoard){
    if(gBoardMode!==s.mode || !bd.querySelector('[data-sq]')) gBuildBoard(s.mode);
    gPlaceTokens(true);
  }
  gEl.querySelector('#gLegend').innerHTML = showBoard ? gLegendHtml(s) : '';
  gEl.querySelector('#gBottom').innerHTML = gBottomHtml(s);
  gEl.querySelector('#gModal').innerHTML = gAnimating ? '' : gModalHtml(s);
}

/* ---------- Azioni ---------- */
function gReadSetup(){
  const b = $('#gbud'), f = $('#gfin');
  if(b) gSetup.budget = Math.max(0, parseInt(b.value,10) || 0);
  if(f) gSetup.finals = f.value;
}
async function gDo(fn){
  if(gBusy || !G) return;
  gBusy = true; gameRender();
  try{ await fn(); } finally { gBusy = false; gameRender(); }
}
function gAnimateDice(die){
  return new Promise(function(res){
    const el = gEl && gEl.querySelector('#gDice'), face = gEl && gEl.querySelector('#gDiceFace');
    if(!el || !face){ res(); return; }
    el.classList.remove('pop'); el.classList.add('roll');
    let n = 0;
    const iv = setInterval(function(){
      face.textContent = G_FACES[gRand(6)];
      if(++n >= 11){
        clearInterval(iv); el.classList.remove('roll'); face.textContent = G_FACES[die-1]; el.classList.add('pop');
        try{ if(navigator.vibrate) navigator.vibrate(40); }catch(e){}
        setTimeout(res, 420);
      }
    }, 80);
  });
}
function gRoll(){
  gDo(async function(){
    const s = G.stato, m = gMe();
    if(s.gameStatus!=='attiva' || s.phase!=='roll' || s.currentTurn!==m) return;
    const die = gDie();
    await gAnimateDice(die);
    const ns = gClone();
    gApplyRoll(ns, die);
    if(await gSave(ns, 'tirato', gOther(m))){ gModalOpen = true; gSeenCh = null; }
  });
}
function gComplete(status, noPen){
  gDo(async function(){
    const s = G.stato, ch = s.currentChallenge, m = gMe();
    if(!ch) return;
    if(ch.physical && status==='completata' && !(ch.agree.goddess && ch.agree.slave)){ toast('Serve il «Concordo» di entrambi'); return; }
    const ns = gClone();
    if(status==='saltata' && m==='slave' && !noPen && !ch.money && !ch.system && ch.category!=='arrivo')
      ns.pendingPenalty = {title:ch.title, square:ch.square, at:new Date().toISOString()};
    gAdvance(ns, status);
    const dest = gOther(m);
    const ev = ns.phase==='finale' ? 'completato' : (ns.currentTurn===dest ? 'turno' : 'completato');
    if(await gSave(ns, ev, dest)){ gPanel = ''; gRuleOpen = false; gEditing = false; }
  });
}
function gSimple(mut, ev, dest){
  gDo(async function(){ const ns = gClone(); if(mut(ns)===false) return; await gSave(ns, ev||null, dest||null); });
}
async function gClick(e){
  const cell = e.target.closest('.gc');
  if(cell && gEl.contains(cell)){ gCellInfo(parseInt(cell.dataset.sq,10)); return; }
  const b = e.target.closest('[data-g]');
  if(!b || !gEl.contains(b)) return;
  const a = b.dataset.g, m = gMe();
  if(a==='toggle'){
    gOpen = !gOpen;
    try{ localStorage.setItem('gd_gopen', gOpen ? '1' : '0'); }catch(x){}
    gameRender();
    if(gOpen) requestAnimationFrame(function(){ gPlaceTokens(false); });
    return;
  }
  if(a==='legend'){ gLegendOpen = !gLegendOpen; try{ localStorage.setItem('gd_gleg', gLegendOpen ? '1' : '0'); }catch(x){} return gameRender(); }
  if(a==='mode'){ gReadSetup(); gSetup.mode = b.dataset.m; return gameRender(); }
  if(a==='start'){ gReadSetup(); gSetup.start = b.dataset.s; return gameRender(); }
  if(a==='newsetup'){ gForceSetup = true; return gameRender(); }
  if(a==='newgame'){
    gReadSetup();
    const finals = String(gSetup.finals||'').split('\n').map(function(x){ return x.trim(); }).filter(Boolean).slice(0,8);
    const st = gNewState({mode:gSetup.mode, start:gSetup.start, budget:gSetup.budget, finals:finals});
    b.disabled = true;
    const r = await sb.rpc('gioco_nuova',{p_stato:st});
    if(r.error){ b.disabled = false; return toast('Non riuscito, riprova'); }
    gForceSetup = false; gPanel = ''; gSeenCh = null;
    await gLoad(); gameRender(); toast('Partita avviata');
    return;
  }
  if(!G) return;
  if(a==='roll') return gRoll();
  if(a==='openmodal'){ gModalOpen = true; return gameRender(); }
  if(a==='closemodal'){ gModalOpen = false; return gameRender(); }
  if(a==='rule'){ gRuleOpen = !gRuleOpen; return gameRender(); }
  if(a==='edit'){ gEditing = true; return gameRender(); }
  if(a==='canceledit'){ gEditing = false; return gameRender(); }
  if(a==='saveedit'){
    const t = (($('#gedit')||{}).value||'').trim();
    if(!t) return toast('Il testo non può essere vuoto');
    gEditing = false;
    return gSimple(function(ns){ ns.currentChallenge.description = t; ns.currentChallenge.agree = {goddess:false, slave:false}; if(ns.undo) ns.undo.persistent = true; }, 'prova', gOther(m));
  }
  if(a==='agree') return gSimple(function(ns){ const ag = ns.currentChallenge.agree; ag[m] = !ag[m]; if(ns.undo) ns.undo.persistent = true; });
  if(a==='complete') return gComplete('completata');
  if(a==='skip') return gComplete('saltata');
  if(a==='skipsq') return gComplete('saltata', true);
  if(a==='change') return gSimple(function(ns){ if(!gChangeCard(ns)){ toast('Nessuna alternativa disponibile'); return false; } }, 'prova', gOther(m));
  if(a==='gorder'){
    const ch = G.stato.currentChallenge;
    if(!ch || ch.ordered) return;
    const mins = Math.max(5, ch.duration || 10);
    const r = await sb.from('ordini').insert({categoria:'obbligo', tipo:'custom', testo:ch.description, scade_at:new Date(now()+mins*60000).toISOString()}).select().single();
    if(r.error) return toast('Invio non riuscito, riprova');
    if(r.data){ orders.unshift(r.data); sig = signature(); }
    toast('Ordine inviato allo schiavo');
    return gSimple(function(ns){ ns.currentChallenge.ordered = true; if(ns.undo) ns.undo.persistent = true; });
  }
  if(a==='pause') return gSimple(function(ns){ ns.gameStatus = 'pausa'; ns.pausedBy = m; }, 'pausa', gOther(m));
  if(a==='resume') return gSimple(function(ns){ ns.gameStatus = 'attiva'; ns.pausedBy = null; }, 'pausa', gOther(m));
  if(a==='undo'){
    if(!confirm("Annullare l'ultimo tiro?")) return;
    return gSimple(function(ns){ if(!gCanUndo(ns)){ toast('Non più annullabile'); return false; } gUndo(ns); }, 'modificato', gOther(m));
  }
  if(a==='panel'){ gPanel = b.dataset.p || ''; return gameRender(); }
  if(a==='end1' || a==='end2'){
    if(!confirm('Terminare la partita?')) return;
    const why = a==='end1' ? 'abbandono' : 'chiusura anticipata';
    gPanel = '';
    return gSimple(function(ns){ ns.gameStatus = 'terminata'; ns.endReason = why; ns.phase = 'fine'; }, 'fine', gOther(m));
  }
  if(a==='restore' && m==='goddess') return gSimple(function(ns){ ns.gameStatus = 'pausa'; ns.pausedBy = 'goddess'; ns.endReason = null; ns.phase = ns.currentChallenge ? 'challenge' : 'roll'; }, 'pausa', 'slave');
  if(a==='finpick' && m==='goddess'){
    const i = parseInt(b.dataset.i, 10);
    return gSimple(function(ns){ ns.finale = (ns.settings.finalOptions||[])[i] || ''; ns.gameStatus = 'terminata'; ns.endReason = 'finale'; ns.phase = 'fine'; }, 'fine', 'slave');
  }
  if(a==='penopen'){ gPanel = 'pen'; return gameRender(); }
  if(a==='pennone') return gSimple(function(ns){ ns.pendingPenalty = null; });
  if(a==='penpick' || a==='pencustom'){
    const s = G.stato;
    let testo = '';
    if(a==='penpick'){
      const opts = GCARDS.filter(function(c){ return c.mode===s.mode && c.category==='penitenza' && c.actor==='goddess_roll' && !c.money && c.squareNumber==null; });
      const c = opts[parseInt(b.dataset.i,10)]; if(c) testo = gFill(s, c.description);
    } else testo = (($('#gpen')||{}).value||'').trim();
    if(!testo) return toast('Scrivi o scegli la penitenza');
    const r = await sb.rpc('assegna_penitenza',{p_scaduto:null, p_tipo:'custom', p_testo:testo});
    if(r.error) return toast('Non riuscito, riprova');
    toast('Penitenza assegnata allo schiavo');
    gPanel = '';
    return gSimple(function(ns){ ns.pendingPenalty = null; });
  }
  if(a==='savesettings'){
    const bud = Math.max(0, parseInt((($('#gsbud')||{}).value),10) || 0);
    const fin = String((($('#gsfin')||{}).value)||'').split('\n').map(function(x){ return x.trim(); }).filter(Boolean).slice(0,8);
    toast('Impostazioni salvate');
    return gSimple(function(ns){ ns.settings.budgetMax = bud; ns.settings.finalOptions = fin.length ? fin : G_FINALS.slice(); });
  }
  if(a==='addcard'){
    const t = (($('#gcT')||{}).value||'').trim(), d = (($('#gcD')||{}).value||'').trim();
    if(!t || !d) return toast('Titolo e descrizione sono obbligatori');
    const cat = $('#gcC').value, actor = $('#gcA').value, diff = parseInt($('#gcF').value,10) || 2;
    const stamp = new Date().toISOString();
    toast('Prova aggiunta al mazzo');
    return gSimple(function(ns){
      ns.settings.customCards = (ns.settings.customCards||[]).concat([{id:'custom-'+Date.now(), mode:'any', squareNumber:null, category:cat, actor:actor,
        title:t, description:d, difficulty:diff, estimatedDuration:null, completionCriteria:G_CRIT[cat]||'Prova completata.', enabled:true,
        tags:['custom'], createdAt:stamp, updatedAt:stamp, money:false, order:false, physical:false, imaginary:false}]);
    });
  }
  if(a==='delcard'){
    const i = parseInt(b.dataset.i,10);
    return gSimple(function(ns){ ns.settings.customCards.splice(i,1); });
  }
}
window.addEventListener('resize', function(){ gPlaceTokens(false); });

/* Carica la libreria Supabase, con un secondo indirizzo di riserva */
(function(){
  var urls = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'
  ];
  function tryLoad(i){
    if(i >= urls.length){
      document.getElementById('app').innerHTML =
        '<div class="center"><p class="muted">Impossibile caricare la libreria. Controlla la connessione o disattiva blocchi pubblicità/DNS filtranti.</p></div>';
      return;
    }
    var s = document.createElement('script');
    s.src = urls[i];
    s.onload = function(){ if(window.supabase) gdStart(); else tryLoad(i+1); };
    s.onerror = function(){ tryLoad(i+1); };
    document.head.appendChild(s);
  }
  tryLoad(0);
})();
</script>
