/* ---------- ICONE E TEMA ---------- */
function ic(n){ return '<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>'; }
function brand(){
  const T = THEMES[theme];
  return '<h1 class="brand"><span class="orn">'+ic(T.orn[0])+'</span>'+(theme==='cuck'?'Goddess':APP_NAME)+'<span class="orn">'+ic(T.orn[1])+'</span></h1>';
}
function makeIcon(size){
  const T = THEMES[theme];
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,size,size);
  g.addColorStop(0,T.bg[0]); g.addColorStop(1,T.bg[1]);
  x.fillStyle = g; x.fillRect(0,0,size,size);
  x.strokeStyle = T.acc; x.lineWidth = size*0.025;
  x.beginPath(); x.arc(size/2,size/2,size*0.34,0,Math.PI*2); x.stroke();
  x.fillStyle = T.acc; x.font = '600 '+(size*0.46)+'px Georgia,serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(T.glyph, size/2, size/2 + size*0.03);
  return c.toDataURL('image/png');
}
function buildIcons(){
  try{
    ['gd-icon','gd-manifest'].forEach(id=>{ const e=document.getElementById(id); if(e) e.remove(); });
    const T = THEMES[theme];
    const l = document.createElement('link'); l.id='gd-icon'; l.rel='apple-touch-icon'; l.href=makeIcon(180); document.head.appendChild(l);
    const m = {name:APP_NAME, short_name:APP_NAME, display:'standalone', background_color:T.ink, theme_color:T.ink,
      start_url: location.href.split('#')[0].split('?')[0],
      icons:[{src:makeIcon(192),sizes:'192x192',type:'image/png'},{src:makeIcon(512),sizes:'512x512',type:'image/png'}]};
    const mf = document.createElement('link'); mf.id='gd-manifest'; mf.rel='manifest';
    mf.href = URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    document.head.appendChild(mf);
  }catch(e){}
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', THEMES[theme].ink);
}
function setTheme(t){
  if(!THEMES[t]) return;
  theme = t; try{ localStorage.setItem('gd_theme', t); }catch(e){}
  applyTheme(); buildIcons();
}

let tt;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2600); }
function buzz(){ try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch(e){} }
function fdate(d){ return new Date(d).toLocaleString('it-IT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function fmt(ms){ const s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
const now = () => Date.now() + off;
async function sha(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('gd:'+s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function typing(){ const a=document.activeElement; return !!(a && a.tagName==='TEXTAREA' && a.value.trim().length>0); }

/* ---------- PIN ---------- */
function pinPad(title, cb){
  let v = '';
  app.innerHTML = '<div class="center">'+brand()+'<p class="tag">'+esc(THEMES[theme].tag)+'</p><p class="muted">'+esc(title)+'</p>'+
    '<div class="dots">'+'<i></i>'.repeat(4)+'</div>'+
    '<div class="pad">'+[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':'<button data-k="'+k+'">'+k+'</button>').join('')+'</div></div>';
  const upd = () => document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<v.length));
  document.querySelector('.pad').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    const k = b.dataset.k;
    if(k==='⌫') v = v.slice(0,-1); else if(v.length<4) v += k;
    upd();
    if(v.length===4){ const p=v; v=''; setTimeout(()=>{ upd(); cb(p); },120); }
  };
}
function setPin(next){
  pinPad('Scegli un PIN di 4 cifre', p1 => {
    pinPad('Ripeti il PIN', async p2 => {
      if(p1!==p2){ toast('I PIN non coincidono'); setPin(next); return; }
      localStorage.setItem(PINKEY, await sha(p1)); next();
    });
  });
}
function unlock(next){
  pinPad('Inserisci il PIN', async p => {
    if(await sha(p) === localStorage.getItem(PINKEY)){ tries=0; next(); }
    else { tries++; if(tries>=5){ await logout(); return; } toast('PIN errato'); unlock(next); }
  });
}

/* ---------- NOTIFICHE PUSH ---------- */
function pushOK(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }
function standalone(){ return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function swReady(){
  return Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(()=>r(null),2000))]);
}
function b64u(s){
  const p = '='.repeat((4 - s.length % 4) % 4);
  const r = atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));
  const o = new Uint8Array(r.length);
  for(let i=0;i<r.length;i++) o[i] = r.charCodeAt(i);
  return o;
}
async function syncPush(){
  if(!pushOK() || Notification.permission!=='granted' || !uid) return;
  try{
    const reg = await swReady(); if(!reg) return;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(VAPID_PUBLIC)});
    const j = sub.toJSON();
    await sb.from('push_subs').upsert({user_id:uid, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth},{onConflict:'endpoint'});
  }catch(e){}
}
async function enablePush(){
  try{
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ toast('Notifiche non attivate'); render(); return; }
    await syncPush(); toast('Notifiche attivate'); render();
  }catch(e){ toast('Notifiche non disponibili su questo dispositivo'); }
}
function pushBanner(){
  if(!pushOK()){
    if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone())
      return '<p class="banner">Per ricevere le notifiche aggiungi l\'app alla schermata Home e aprila da lì.</p>';
    return '';
  }
  if(Notification.permission==='default') return '<button class="banner" data-a="push">🔔 Attiva le notifiche</button>';
  if(Notification.permission==='denied') return '<p class="banner">Notifiche bloccate: riattivale dalle impostazioni del telefono.</p>';
  return '';
}

function showLogin(){
  app.innerHTML = '<div class="center">'+brand()+'<p class="tag">'+esc(THEMES[theme].tag)+'</p>'+
    '<div class="form"><input id="em" type="email" placeholder="Email" autocomplete="username" autocapitalize="none">'+
    '<input id="pw" type="password" placeholder="Password" autocomplete="current-password">'+

  $('#go').onclick = async () => {
    const email = $('#em').value.trim(), password = $('#pw').value;
    if(!email || !password) return toast('Inserisci email e password');
    $('#go').disabled = true;
    const {error} = await sb.auth.signInWithPassword({email, password});
    if(error){ $('#go').disabled=false; return toast('Accesso non riuscito'); }
    afterLogin();
  };
}
function afterLogin(){
  if(localStorage.getItem(PINKEY)) boot(); else setPin(boot);
}
async function logout(){
  stopLive();
  try{
    if(pushOK()){
      const reg = await swReady();
      const sub = reg && await reg.pushManager.getSubscription();
      if(sub) await sb.from('push_subs').delete().eq('endpoint', sub.endpoint);
    }
  }catch(e){}
  await sb.auth.signOut();
  localStorage.removeItem(PINKEY);
  localStorage.removeItem('gd_cache');
  role = null; uid = null; orders = []; sig = ''; ui = {step:'home'}; locked = false; tries = 0; urlCache = {};
  showLogin();
}

/* ---------- DATI ---------- */
function readCache(){ try{ return JSON.parse(localStorage.getItem('gd_cache') || 'null'); }catch(e){ return null; } }
function writeCache(){
  try{ if(uid && role) localStorage.setItem('gd_cache', JSON.stringify({uid:uid, role:role, orders:orders.slice(0,60)})); }catch(e){}
}
async function loadOrders(){
  const r = await sb.from('ordini').select('*').order('created_at',{ascending:false}).limit(200);
  if(r.error) return false;
  orders = r.data; writeCache(); return true;
}
async function syncClock(){
  try{
    const t0 = Date.now();
    const r = await sb.rpc('adesso');
    if(!r.error && r.data) off = new Date(r.data).getTime() - (t0 + Date.now())/2;
    lastClock = Date.now();
  }catch(e){}
}
function signature(){ return orders.map(o=>[o.id,o.stato,o.scade_at,o.rinvii,o.penitenza_di].join(':')).join(','); }

/* stato derivato: done / expired / pending */
function stat(o){
  if(o.stato==='completato') return 'done';
  if(o.categoria!=='penitenza' && o.scade_at && new Date(o.scade_at).getTime() <= now()) return 'expired';
  return 'pending';
}
function hasPen(o){ return orders.some(p=>p.penitenza_di===o.id); }
function lists(){
  const pending=[], needPen=[], archive=[];
  orders.forEach(o=>{
    const s = stat(o);
    if(s==='pending') pending.push(o);
    else if(s==='done') archive.push(o);
    else if(hasPen(o)) archive.push(o);
    else needPen.push(o);
  });
  return {pending, needPen, archive};
}
function curOrder(){
  if(ui.step==='detail'){
    const o = orders.find(x=>x.id===ui.id);
    if(o && stat(o)==='pending') return o;
  }
  return lists().pending.slice().reverse()[0];
}

async function refresh(notify){
  const prev = orders.slice();
  if(!await loadOrders()) return;
  const s = signature();
  if(s === sig) return;
  sig = s;
  if(notify){
    if(role==='schiavo' && orders.some(o=>o.stato==='in_attesa' && !prev.find(p=>p.id===o.id))){ buzz(); toast('Nuovo ordine dalla Padrona'); }
    if(role==='padrona' && orders.some(o=>o.stato==='completato' && prev.find(p=>p.id===o.id && p.stato==='in_attesa'))){ buzz(); toast('Il tuo schiavo ha risposto'); }
  }
  if(locked) return;
  if(typing()){ pendingRender = true; return; }
  render();
}
function startLive(){
  stopLive();
  channel = sb.channel('ordini-live').on('postgres_changes',{event:'*',schema:'public',table:'ordini'},()=>{
    clearTimeout(rtT); rtT = setTimeout(()=>refresh(true), 350);
  }).subscribe();
  poll = setInterval(()=>{ if(!document.hidden && !locked) refresh(true); }, 25000);
}
function stopLive(){ if(channel){ sb.removeChannel(channel); channel=null; } if(poll){ clearInterval(poll); poll=null; } }

async function boot(){
  const s0 = await sb.auth.getSession();
  uid = s0.data.session ? s0.data.session.user.id : null;
  /* prima schermata subito, dai dati salvati; poi si aggiorna */
  const c = readCache();
  if(c && c.uid===uid && c.role){ role = c.role; orders = c.orders || []; sig = signature(); render(); }
  const res = await Promise.all([sb.from('ruoli').select('ruolo').maybeSingle(), loadOrders()]);
  const rl = res[0];
  if(rl.error){
    if(!role){ toast('Connessione assente, riprovo...'); setTimeout(boot, 4000); return; }
  } else if(!rl.data){
    toast('Accesso non autorizzato'); await logout(); return;
  } else {
    role = rl.data.ruolo;
  }
  sig = signature(); writeCache();
  startLive(); render();
  syncPush(); syncClock(); applyTarget();
}

/* ---------- RENDER ---------- */
function done(){ return orders.filter(o=>o.stato==='completato').length; }

function header(label){

    '<button class="link gear" data-a="settings" aria-label="Impostazioni">'+ic('gear')+'</button></div><div class="chain"></div>';
}

function cardHtml(o, who){
  const c = CATS[o.categoria] || {nome:o.categoria};
  const s = stat(o);
  const src = o.penitenza_di ? orders.find(x=>x.id===o.penitenza_di) : null;
  let r = '';
  if(s==='done'){
    let val = '';
    if(o.risposta_tipo==='scelta') val = '<div class="val"><b>'+esc(o.risposta_testo==='SI'?'Sì':'No')+'</b></div>';
    else if(o.risposta_tipo==='ok') val = '<div class="val"><b>Obbedisce.</b></div>';
    else if(o.risposta_testo) val = '<div class="val">'+esc(o.risposta_testo)+'</div>';
    const media = o.risposta_media ? '<div class="media" data-path="'+esc(o.risposta_media)+'" data-tipo="'+esc(o.risposta_tipo)+'"></div>' : '';
    r = '<div class="resp"><div class="lab">Risposta · '+fdate(o.risposta_at)+'</div>'+val+media+'</div>';
  }
  const badge = s==='done' ? '<span class="badge ok">Eseguito</span>'
              : s==='expired' ? '<span class="badge red">Scaduto</span>'
              : '<span class="badge">In attesa</span>';
  let timer = '';
  if(s==='pending' && o.scade_at && o.categoria!=='penitenza')
    timer = ' <span class="timer" data-exp="'+esc(o.scade_at)+'"></span>'+(o.rinvii?' · rinvii '+o.rinvii+'/3':'');
  let btns = '';
  if(who==='padrona'){

    '<div class="txt">'+esc(o.testo)+'</div>'+
    '<div style="margin-top:8px">'+badge+timer+'</div>'+
    (btns ? '<div>'+btns+'</div>' : '')+r+'</div>';

  }

    return h + '<button class="link" data-a="back">‹ Indietro</button><p class="lead">'+c.nome+'</p>'+

    return h + '<button class="link" data-a="back">‹ Indietro</button>'+cardHtml(o,'padrona');

  }
  if(st==='pencompose'){
    const opts = [['foto','Dovrà inviare una foto'],['video','Dovrà inviare un video'],['soldi','Pagamento con prova'],['custom','Risposta libera']];
    return h + '<button class="link" data-a="back">‹ Indietro</button><p class="lead">Penitenza</p>'+
      '<p class="note">Puoi modificare il testo prima di inviare. Nessun limite di tempo.</p>'+
      '<select id="pt">'+opts.map(o=>'<option value="'+o[0]+'"'+(ui.ptipo===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+
      '<textarea id="ot" rows="5" placeholder="Scrivi la penitenza">'+esc(ui.ptxt||'')+'</textarea>'+
      '<button class="btn block" data-a="penorder">Assegna penitenza</button>';
  }

  /* home */
  h += pushBanner();
  h += '<p class="lead">Cosa desideri?</p><div class="grid">'+
    ['domanda','obbligo','verita','richiesta'].map(k=>'<button class="tile" data-a="cat" data-c="'+k+'"><span class="ico">'+ic(CATS[k].icona)+'</span><span class="tn">'+CATS[k].nome+'</span></button>').join('')+'</div>';
  const n = L.needPen.length;
  h += '<button class="tile wide" data-a="pen"><span class="ico">'+ic('chain')+'</span><span class="tn">Penitenze</span>'+
    (n ? '<span class="badge ok">'+n+' scaduti</span>' : '')+'</button>';
  const open = L.pending.concat(L.needPen).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(open.length) h += '<p class="sec">In attesa</p>'+open.map(o=>cardHtml(o,'padrona')).join('');
  h += archiveRows(L.archive);
  return h;
}

function respArea(o){
  const c = o.categoria, t = o.tipo;
  const isObb = (c==='obbligo' || c==='penitenza');
  if(c==='domanda') return '<div class="row2"><button class="btn" data-a="yn" data-v="SI">Sì</button><button class="btn ghost" data-a="yn" data-v="NO">No</button></div>';
  if(c==='richiesta') return '<button class="btn block" data-a="ok">Obbedisco, Padrona</button>';
  let h = '';
  if(c==='verita' || t==='custom') h += '<textarea id="rt" rows="4" placeholder="'+(c==='verita'?'Scrivi la verità':'La tua risposta')+'"></textarea>';
  if(isObb){
    const acc = t==='video'?'video/*' : t==='foto'?'image/*' : t==='soldi'?'image/*,application/pdf' : 'image/*,video/*';
    const cap = (t==='foto'||t==='video') ? ' capture' : '';
    const lab = t==='foto'?'Scatta la foto' : t==='video'?'Registra il video' : t==='soldi'?'Allega la prova del pagamento' : 'Allega foto o video (facoltativo)';
    h += '<label class="btn ghost block">'+lab+'<input type="file" id="rf" accept="'+acc+'"'+cap+' hidden></label><div id="prev"></div>';
  }
  return h + '<button class="btn block" id="sendbtn" data-a="send">Invia alla Padrona</button>';
}

function answerCard(cur){
  const isPen = cur.categoria==='penitenza';
  const src = cur.penitenza_di ? orders.find(x=>x.id===cur.penitenza_di) : null;
  const inf = (cur.categoria==='obbligo' || isPen) ? OBB[cur.tipo].nota : CATS[cur.categoria].nota;
  const timed = cur.scade_at && !isPen;
  return '<div class="card cur"><div class="head"><span class="cat'+(isPen?' pen':'')+'">'+CATS[cur.categoria].nome+'</span><span>'+fdate(cur.created_at)+'</span></div>'+
    (src ? '<div class="note" style="margin:0 0 6px">Penitenza per: «'+esc(src.testo)+'»</div>' : '')+
    '<div class="big">'+esc(cur.testo)+'</div>'+
    (timed ? '<div class="timerline">Tempo rimasto <b class="timer" data-exp="'+esc(cur.scade_at)+'"></b></div>' : '')+
    (inf ? '<p class="note">'+esc(inf)+'</p>' : '')+
    respArea(cur)+
    (timed && cur.rinvii<3 ? '<button class="btn ghost block" data-a="rinvia">Rinvia di 10 minuti (restano '+(3-cur.rinvii)+')</button>' : '')+
    '</div>';
}

function viewSchiavo(){
  const L = lists();
  const arch = L.archive.concat(L.needPen);
  let h = header('Schiavo');

  if(ui.step==='settings') return h + settingsHtml();
  if(ui.step==='archive'){
    const a = archiveView(arch, 'schiavo');
    if(a===null) return viewSchiavo();
    return h + a;
  }
  if(ui.step==='detail'){
    const o = orders.find(x=>x.id===ui.id);
    if(!o){ ui = {step:'home'}; return viewSchiavo(); }
    return h + '<button class="link" data-a="back">‹ Indietro</button>' + (stat(o)==='pending' ? answerCard(o) : cardHtml(o,'schiavo'));
  }

  const cur = L.pending.slice().reverse()[0];
  h += pushBanner();
  if(cur){
    h += answerCard(cur);
    const others = L.pending.length - 1;
    if(others>0) h += '<p class="note" style="margin-top:12px">Altri ordini in attesa: '+others+'</p>';
  } else {
    h += '<p class="lead">Attendi gli ordini della Padrona.</p>';
  }
  h += archiveRows(arch);
  return h;
}

async function hydrate(){
  const els = Array.from(document.querySelectorAll('[data-path]'));
  if(!els.length) return;
  const fill = () => els.forEach(el=>{
    if(el.dataset.done) return;
    const e = urlCache[el.dataset.path]; if(!e || !e.url) return;
    const t = el.dataset.tipo;
    el.innerHTML = t==='video' ? '<video src="'+e.url+'" controls playsinline preload="none"></video>'
                 : t==='image' ? '<img src="'+e.url+'" alt="" loading="lazy" decoding="async">'
                 : '<a href="'+e.url+'" target="_blank" rel="noopener">Apri il file</a>';
    el.dataset.done = '1';
  });
  fill();
  const need = Array.from(new Set(els.map(el=>el.dataset.path).filter(p=>{
    const e = urlCache[p]; return !e || Date.now()-e.t > 50*60*1000;
  })));
  if(!need.length) return;
  try{
    const r = await sb.storage.from('media').createSignedUrls(need, 3600);
    (r.data || []).forEach(d=>{ if(d && d.signedUrl) urlCache[d.path] = {url:d.signedUrl, t:Date.now()}; });
  }catch(e){}
  fill();
}

/* ---------- TIMER ---------- */
function tick(){
  let expired = false;
  document.querySelectorAll('.timer').forEach(el=>{
    const left = new Date(el.dataset.exp).getTime() - now();
    if(left<=0){ el.textContent = 'Scaduto'; expired = true; }
    else el.textContent = fmt(left);
  });
  if(expired && !expFlag && !locked){
    expFlag = true; sig = '';
    refresh(false);
    setTimeout(()=>{ expFlag = false; }, 5000);
  }
}
setInterval(tick, 1000);

/* ---------- AZIONI ---------- */
function localDone(o, testo, path, tipo){
  o.stato = 'completato'; o.risposta_testo = testo; o.risposta_media = path; o.risposta_tipo = tipo;
  o.risposta_at = new Date().toISOString();
}

async function applyTarget(){
  if(!openTarget || !role || locked) return;
  const id = openTarget;
  let o = orders.find(x=>x.id===id);
  if(!o && await loadOrders()){ sig = signature(); o = orders.find(x=>x.id===id); }
  openTarget = null;
  if(!o){ toast('Ordine non più disponibile'); render(); return; }
  ui = {step:'detail', id:id};
  render();
}

async function shrinkImage(f){
  if(!f.type || f.type.indexOf('image/')!==0 || f.type==='image/gif') return f;
  try{
    let bmp;
    try{ bmp = await createImageBitmap(f, {imageOrientation:'from-image'}); }
    catch(e){ bmp = await createImageBitmap(f); }
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if(sc===1 && f.size < 1.2*1024*1024) return f;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
    return blob ? new File([blob], 'foto.jpg', {type:'image/jpeg'}) : f;
  }catch(e){ return f; }
}

async function sendOrder(){
  const testo = ($('#ot').value||'').trim();
  if(!testo) return toast('Scrivi qualcosa');
  const tipo = ui.cat==='obbligo' ? ui.sub : 'custom';
  const b = $('[data-a=order]'); b.disabled = true;
  const r = await sb.from('ordini').insert({categoria:ui.cat, tipo, testo}).select().single();
  if(r.error){ b.disabled=false; return toast('Invio non riuscito, riprova'); }
  if(r.data) orders.unshift(r.data);
  sig = signature(); writeCache();
  toast('Ordine inviato'); ui = {step:'home'}; render();
}

async function sendPen(){
  const t = ($('#ot').value||'').trim();
  if(!t) return toast('Scrivi la penitenza');
  const b = $('[data-a=penorder]'); b.disabled = true;
  const r = await sb.rpc('assegna_penitenza',{p_scaduto:ui.src||null, p_tipo:$('#pt').value, p_testo:t});
  if(r.error){ b.disabled=false; return toast('Non riuscito, riprova'); }
  toast('Penitenza assegnata'); ui = {step:'home'}; render();
  sig=''; refresh(false);
}

async function delOrder(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  if(!confirm('Eliminare definitivamente questa richiesta?')) return;
  orders = orders.filter(x=>x.id!==id); sig = signature(); writeCache();
  if(ui.step==='detail') ui = {step:'home'};
  render(); toast('Eliminata');
  try{
    if(o.risposta_media) await sb.storage.from('media').remove([o.risposta_media]);
    const r = await sb.from('ordini').delete().eq('id', id);
    if(r.error) throw r.error;
  }catch(e){ toast('Eliminazione non riuscita'); sig=''; refresh(false); }
}

async function answer(o, testo, path, tipo){
  const r = await sb.rpc('rispondi',{p_id:o.id, p_testo:testo, p_media:path, p_tipo:tipo});
  if(r.error) throw r.error;
}
function isExpiredErr(e){ return /scaduto/i.test(String(e && e.message)); }

async function replyChoice(kind, val){
  const o = curOrder(); if(!o) return;
  const testo = kind==='yn' ? val : 'Obbedisco', tipo = kind==='yn' ? 'scelta' : 'ok';
  const snap = Object.assign({}, o);
  localDone(o, testo, null, tipo); sig = signature(); ui = {step:'home'}; render(); toast('Inviato alla Padrona');
  try{ await answer(o, testo, null, tipo); writeCache(); }
  catch(e){
    Object.assign(o, snap); sig = signature(); render();
    toast(isExpiredErr(e) ? 'Tempo scaduto' : 'Invio non riuscito, riprova');
    sig=''; refresh(false);
  }
}

async function sendReply(){
  const o = curOrder(); if(!o) return;
  const rt = ($('#rt') ? $('#rt').value : '').trim();
  let f = pendingFile;
  const c = o.categoria, t = o.tipo;
  const isObb = (c==='obbligo' || c==='penitenza');
  if(c==='verita' && !rt) return toast('Scrivi la risposta');
  if(isObb && t!=='custom' && !f) return toast('Allega quanto richiesto');
  if(isObb && t==='custom' && !rt && !f) return toast('Rispondi o allega qualcosa');
  const b = $('#sendbtn'); b.disabled = true; b.textContent = 'Invio in corso...';
  try{
    let path = null, tipo = 'testo';
    if(f){
      f = await shrinkImage(f);
      if(f.size > MAX_BYTES){ b.disabled=false; b.textContent='Invia alla Padrona'; return toast('File troppo grande (max 50 MB)'); }
      const ext = ((f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)) || 'bin';
      path = o.id+'/'+Date.now()+'.'+ext;
      const up = await sb.storage.from('media').upload(path, f, {contentType: f.type || undefined});
      if(up.error) throw up.error;
      tipo = f.type.indexOf('video')===0 ? 'video' : f.type.indexOf('image')===0 ? 'image' : 'file';
    }
    await answer(o, rt || null, path, tipo);
    localDone(o, rt || null, path, tipo);
    pendingFile = null; sig = signature(); writeCache(); ui = {step:'home'}; render(); toast('Inviato alla Padrona');
  }catch(e){
    if(isExpiredErr(e)){ toast('Tempo scaduto'); sig=''; await refresh(false); render(); return; }
    toast('Invio non riuscito, riprova'); b.disabled=false; b.textContent='Invia alla Padrona';
  }
}

async function rinvia(){
  const o = curOrder(); if(!o) return;
  const snap = {scade_at:o.scade_at, rinvii:o.rinvii};
  o.scade_at = new Date(new Date(o.scade_at).getTime() + 10*60*1000).toISOString();
  o.rinvii = (o.rinvii||0) + 1;
  sig = signature(); render(); toast('Rinviato di 10 minuti');
  const r = await sb.rpc('rinvia',{p_id:o.id});
  if(r.error){ Object.assign(o, snap); sig = signature(); render(); toast('Non rinviabile'); sig=''; refresh(false); }
}

/* ---------- EVENTI ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a;
  if(a==='logout') return logout();
  if(a==='push') return enablePush();
  if(a==='settings'){ ui = {step:'settings'}; return render(); }
  if(a==='theme'){ setTheme(b.dataset.t); return render(); }
  if(a==='pack'){ pack = b.dataset.p; try{ localStorage.setItem('gd_pack', pack); }catch(x){} toast('Livello: '+PACKS[pack].nome); return render(); }
  if(a==='cat'){
    ui = {step:'home', cat:b.dataset.c};
    if(CATS[ui.cat].sub.length===1){ ui.sub = CATS[ui.cat].sub[0][0]; ui.step='compose'; } else ui.step='sub';
    return render();
  }
  if(a==='sub'){ ui.sub = b.dataset.s; ui.step='compose'; return render(); }
  if(a==='idea'){
    const t = ideas()[parseInt(b.dataset.i,10)]; const ta = $('#ot');
    if(t && ta){ ta.value = t; ta.focus(); }
    return;
  }
  if(a==='arch'){ ui = {step:'archive', cat:b.dataset.c}; return render(); }
  if(a==='pen'){ ui = {step:'pen', src:null, prev:ui}; return render(); }
  if(a==='penfor'){ ui = {step:'pen', src:b.dataset.id, prev:ui}; return render(); }
  if(a==='prs'){
    const i = parseInt(b.dataset.i,10);
    const p = i>=0 ? PACKS[pack].pen[i] : null;
    ui.step = 'pencompose';
    ui.ptipo = p ? p[0] : 'custom';
    ui.ptxt  = p ? p[1] : '';
    return render();
  }
  if(a==='back'){
    const s = ui.step;
    if(s==='compose' && CATS[ui.cat].sub.length>1) ui = {step:'sub', cat:ui.cat};
    else if(s==='pencompose') ui = {step:'pen', src:ui.src, prev:ui.prev};
    else if(s==='pen') ui = ui.prev || {step:'home'};
    else ui = {step:'home'};
    return render();
  }
  if(a==='order') return sendOrder();
  if(a==='penorder') return sendPen();
  if(a==='del') return delOrder(b.dataset.id);
  if(a==='yn') return replyChoice('yn', b.dataset.v);
  if(a==='ok') return replyChoice('ok');
  if(a==='send') return sendReply();
  if(a==='rinvia') return rinvia();
});

app.addEventListener('change', e => {
  if(e.target.id!=='rf') return;
  const f = e.target.files[0]; pendingFile = f || null;
  const p = $('#prev'); if(!p) return;
  if(!f){ p.innerHTML=''; return; }
  const u = URL.createObjectURL(f);
  p.innerHTML = f.type.indexOf('video')===0 ? '<video src="'+u+'" controls playsinline></video>'
              : f.type.indexOf('image')===0 ? '<img src="'+u+'" alt="">'
              : '<p class="note">'+esc(f.name)+'</p>';
});

app.addEventListener('focusout', () => {
  if(!pendingRender) return;
  setTimeout(()=>{ if(pendingRender && !typing() && !locked) render(); }, 300);
});

document.addEventListener('visibilitychange', () => {
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(role && localStorage.getItem(PINKEY) && Date.now()-hiddenAt > LOCK_AFTER){
    locked = true; unlock(()=>{ locked=false; sig=''; refresh(false).then(render).then(applyTarget); });
  } else if(role){ refresh(true); applyTarget(); if(Date.now()-lastClock > 300000) syncClock(); }
});

/* ---------- AVVIO ---------- */
(async function init(){
  const {data} = await sb.auth.getSession();
  if(!data.session){ showLogin(); return; }
  if(localStorage.getItem(PINKEY)){ locked = true; unlock(()=>{ locked=false; boot(); }); }
  else setPin(boot);
})();

})();
}

/* Carica la libreria Supabase, con un secondo indirizzo di riserva */
(function(){
  var urls = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'
  ];
  function tryLoad(i){
    if(i >= urls.length){
      document.getElementById('app').innerHTML =
        '<div class="center"><p class="muted">Impossibile caricare la libreria. Controlla la connessione o disattiva blocchi pubblicità/DNS filtranti.</p></div>';
      return;
    }
    var s = document.createElement('script');
    s.src = urls[i];
    s.onload = function(){ if(window.supabase) gdStart(); else tryLoad(i+1); };
    s.onerror = function(){ tryLoad(i+1); };
    document.head.appendChild(s);
  }
  tryLoad(0);
})();
</script>
