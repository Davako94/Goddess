<!doctype html>
<html lang="it" data-theme="locktober">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GODDESS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B0E22">
<meta name="robots" content="noindex,nofollow">
<title>GODDESS</title>
<link rel="preconnect" href="https://gpkwaexsximqtfamhhyh.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&display=swap"></noscript>
<style>
:root{
  --ink:#1B0E22; --plum:#2E1640; --plum2:#40205A; --gold:#C9A24B; --ivory:#F2E8DA; --steel:#9AA0AE; --blood:#B0254A; --rose:#FF8FAB; --onacc:#1B0E22;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme=latex]{--ink:#0A0A0C;--plum:#17171B;--plum2:#2A2A31;--gold:#E0243E;--ivory:#EDEDF0;--steel:#8E8E99;--blood:#E0243E;--rose:#FF6B81;--onacc:#FFFFFF}
html[data-theme=cuck]{--ink:#0C0A16;--plum:#181430;--plum2:#2C2556;--gold:#B79CFF;--ivory:#EEEAF8;--steel:#9A97B0;--blood:#8E5BFF;--rose:#D3B8FF;--onacc:#0C0A16}
html[data-theme=hard]{--ink:#120606;--plum:#2A0D0D;--plum2:#451616;--gold:#FF5A1F;--ivory:#F5E6DC;--steel:#A8908A;--blood:#D81E1E;--rose:#FF8A5C;--onacc:#120606}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,label,.opt,.tile{touch-action:manipulation}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--ivory);font-family:var(--sans);font-size:16px;line-height:1.45}
body{background:radial-gradient(120% 55% at 50% -8%,var(--plum) 0,var(--ink) 62%) no-repeat,var(--ink);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:520px;margin:0 auto;padding:18px 18px 48px;min-height:100vh}
h1,h2,p{margin:0}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;color:inherit;flex:none}

/* Scritta GODDESS tematica */
.brand{display:flex;align-items:center;gap:.4em;font-family:var(--serif);font-weight:700;font-size:38px;letter-spacing:.06em;color:var(--gold);line-height:1.05}
.brand .orn{font-size:.6em;display:inline-flex;opacity:.95}
.tag{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);opacity:.85;margin-top:-4px}
html[data-theme=latex] .brand{font-family:var(--sans);font-weight:800;letter-spacing:.16em;font-size:28px;text-transform:uppercase}
html[data-theme=cuck] .brand{font-style:italic;letter-spacing:.07em;text-shadow:0 0 20px rgba(183,156,255,.38)}
html[data-theme=hard] .brand{font-family:var(--sans);font-weight:900;letter-spacing:.1em;font-size:30px;text-transform:uppercase;text-shadow:0 0 18px rgba(255,90,31,.5)}
.center .brand{justify-content:center;font-size:40px}
html[data-theme=latex] .center .brand{font-size:30px}
html[data-theme=hard] .center .brand{font-size:32px}

.muted{color:var(--steel);font-size:14px}
.lead{font-family:var(--serif);font-size:28px;font-weight:500;margin:22px 0 12px}
.note{color:var(--steel);font-size:14px;margin:6px 0 14px}

/* Divisore tematico */
.chain{height:10px;margin:14px 0 4px;background:
  radial-gradient(ellipse 9px 4px at 9px 5px,transparent 60%,var(--gold) 64% 100%) 0 0/18px 10px repeat-x;opacity:.8}
html[data-theme=latex] .chain{height:8px;background:radial-gradient(circle at 5px 4px,var(--gold) 2.4px,transparent 3px) 0 0/14px 8px repeat-x;opacity:.9}
html[data-theme=cuck] .chain{height:auto;background:none;overflow:hidden;white-space:nowrap;color:var(--gold);letter-spacing:.55em;text-align:center;line-height:1;margin:14px 0 4px;opacity:.85}
html[data-theme=cuck] .chain::before{content:'♠ ♠ ♠ ♠ ♠ ♠ ♠ ♠ ♠ ♠ ♠ ♠ ♠ ♠ ♠ ♠'}
html[data-theme=hard] .chain{height:8px;background:repeating-linear-gradient(135deg,var(--gold) 0 3px,transparent 3px 9px);opacity:.9}

.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--plum);border:1px solid var(--plum2);border-radius:14px;padding:22px 12px;color:var(--ivory);display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;cursor:pointer}
.tile:active{background:var(--plum2)}
.tile .ico{font-size:34px;color:var(--gold);display:flex}
.tile .tn{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--gold)}
html[data-theme=latex] .tile .tn,html[data-theme=hard] .tile .tn{font-family:var(--sans);font-size:17px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.tile.wide{width:100%;margin-top:12px;flex-direction:row;justify-content:center;flex-wrap:wrap;gap:10px;padding:16px 12px;border-color:var(--blood)}
.tile.wide .tn,.tile.wide .ico{color:var(--rose)}
.tile.locked{opacity:.6}
.list{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--plum);border:1px solid var(--plum2);border-radius:12px;padding:16px;color:var(--ivory);font:inherit;font-size:17px;text-align:left;cursor:pointer}
.opt:active{background:var(--plum2)}
.opt.sel{border-color:var(--gold)}
.opt.idea{font-size:15px;padding:12px 14px;border-style:dashed;color:var(--ivory)}
.rowbtn{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cnt{color:var(--gold)}
.sw i{display:inline-block;width:16px;height:16px;border-radius:50%;margin-left:6px;border:1px solid var(--steel);vertical-align:middle}
.btn{border:0;border-radius:12px;padding:15px 18px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;color:var(--onacc);background:var(--gold)}
.btn.ghost{background:transparent;color:var(--ivory);border:1px solid var(--steel)}
.btn.block{display:block;width:100%;margin-top:12px;text-align:center}
.btn:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.link{background:none;border:0;color:var(--steel);font:inherit;padding:6px 10px 6px 0;cursor:pointer}
.link.red{color:var(--rose)}
.gear{font-size:26px;padding:4px 0 4px 10px;color:var(--steel)}
textarea,select,input[type=email],input[type=password],input[type=text],input[type=number],input[type=tel]{width:100%;background:var(--plum);border:1px solid var(--plum2);border-radius:12px;padding:14px;color:var(--ivory);font:inherit;font-size:17px;resize:vertical}
select{margin-bottom:10px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
.card{background:var(--plum);border:1px solid var(--plum2);border-radius:14px;padding:16px;margin-top:12px}
.card.cur{border-color:var(--gold)}
.card .head{display:flex;justify-content:space-between;gap:8px;color:var(--steel);font-size:13px;margin-bottom:6px}
.card .cat{font-family:var(--serif);font-size:20px;color:var(--gold);font-weight:700}
html[data-theme=latex] .card .cat,html[data-theme=hard] .card .cat{font-family:var(--sans);font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.card .cat.pen{color:var(--rose)}
.card .txt{font-size:19px;white-space:pre-wrap;word-break:break-word}
.big{font-family:var(--serif);font-size:30px;line-height:1.2;white-space:pre-wrap;word-break:break-word;margin:6px 0 4px}
html[data-theme=latex] .big,html[data-theme=hard] .big{font-family:var(--sans);font-size:24px;font-weight:700}
.resp{margin-top:10px;padding-top:10px;border-top:1px dashed var(--plum2)}
.resp .lab{color:var(--steel);font-size:13px}
.resp .val{white-space:pre-wrap;word-break:break-word}
.badge{font-size:12px;border-radius:99px;padding:2px 9px;border:1px solid var(--steel);color:var(--steel)}
.badge.ok{border-color:var(--gold);color:var(--gold)}
.badge.red{border-color:var(--blood);color:var(--rose)}
.timer{font-variant-numeric:tabular-nums;color:var(--gold)}
.timerline{margin:8px 0;color:var(--steel);font-size:15px}
.banner{display:block;width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px dashed var(--gold);background:transparent;color:var(--ivory);font:inherit;font-size:15px;text-align:left}
button.banner{cursor:pointer}
.media img,.media video,#prev img,#prev video{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;margin-top:8px;background:#000}
.media a{color:var(--gold)}
.sec{font-family:var(--serif);font-size:22px;margin:28px 0 0;color:var(--ivory)}
.dots{display:flex;gap:14px;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--gold)}
.dots i.on{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:10px}
.pad button{height:76px;border-radius:50%;background:var(--plum);border:1px solid var(--plum2);color:var(--ivory);font:inherit;font-size:26px}
.pad button:active{background:var(--plum2)}
.form{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ivory);color:var(--ink);padding:11px 18px;border-radius:99px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
#popup{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:18px}
#popup[hidden]{display:none}
.pcard{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:var(--plum);border:1px solid var(--gold);border-radius:20px;padding:22px 18px;text-align:center}
.pfrom{color:var(--steel);font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.pemoji{font-size:84px;line-height:1.1;margin:10px 0;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.ptext{font-family:var(--serif);font-size:30px;line-height:1.2;margin-bottom:16px;word-break:break-word}
html[data-theme=latex] .ptext,html[data-theme=hard] .ptext{font-family:var(--sans);font-weight:800;font-size:24px}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.plist{display:flex;flex-direction:column;gap:8px;margin:12px 0;text-align:left}
.chip{font-size:15px;padding:12px 14px}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pemoji{animation:none}}
.qbtn{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:15px;padding:14px 8px}
.qe{font-size:28px;line-height:1}
.bub{background:var(--plum);border:1px solid var(--plum2);border-radius:14px;padding:12px 14px;margin-top:10px;max-width:92%}
.bub.me{margin-left:auto;border-color:var(--gold)}
.bub .bhead{display:flex;justify-content:space-between;gap:10px;color:var(--steel);font-size:12px;margin-bottom:4px}
.bub .btxt{font-size:17px;word-break:break-word}
.bub .btxt .qe{font-size:22px;vertical-align:-.1em}
.bub .blike{text-align:right}
.bub.unread{border-color:var(--rose)}
.tile.wide.cast,.tile.wide.msg{border-color:var(--gold)}
.tile.wide.cast .tn,.tile.wide.cast .ico,.tile.wide.msg .tn,.tile.wide.msg .ico{color:var(--gold)}
.tcard{background:var(--plum);border:1px solid var(--gold);border-radius:16px;padding:14px;margin-top:12px}
.tcard.st-ritardo{border-color:var(--blood)}
.tcard.st-libero{border-color:var(--steel)}
.trow1{display:flex;gap:14px;align-items:center}
.timg{width:64px;height:64px;flex:none;color:var(--gold);display:flex;align-items:center;justify-content:center}
.tcard.st-ritardo .timg{color:var(--rose)}
.cagepic{width:100%;height:100%}
.tbody{flex:1;min-width:0}
.tlab{font-family:var(--serif);font-size:22px;line-height:1.15;word-break:break-word}
html[data-theme=latex] .tlab,html[data-theme=hard] .tlab{font-family:var(--sans);font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.tcount{font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;color:var(--gold);margin:4px 0}
.tcount.late{color:var(--rose)}
.tsub{color:var(--steel);font-size:13px}
.trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trow input{width:74px;text-align:center}
.trow span{color:var(--steel)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip2{background:transparent;border:1px solid var(--plum2);color:var(--ivory);border-radius:99px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip2:active{background:var(--plum2)}
.opts{margin-top:12px;border:1px dashed var(--plum2);border-radius:12px;padding:10px 12px}
.opts summary{cursor:pointer;color:var(--steel)}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px}
.chk input{width:auto}
a.btn{text-decoration:none;display:block}
.opt small{font-size:12px}
.gteaser{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:14px;border-radius:16px;border:1px solid var(--gold);background:linear-gradient(135deg,var(--plum2),var(--plum));color:var(--ivory);font:inherit;text-align:left;cursor:pointer}
.gteaser.hot{border-color:var(--rose);animation:teaserglow 1.6s ease-in-out infinite}
.gtic{font-size:30px;color:var(--gold);flex:none;line-height:1}
.gtx{flex:1;min-width:0;line-height:1.3}
.gtx b{font-family:var(--serif);font-size:18px;letter-spacing:.04em;color:var(--gold)}
html[data-theme=latex] .gtx b,html[data-theme=hard] .gtx b{font-family:var(--sans);font-size:13px;letter-spacing:.14em;font-weight:800}
.gtx span{font-size:14px}
.gtx small{color:var(--steel);font-size:12px}
.gtgo{font-weight:800;font-size:12px;letter-spacing:.1em;color:var(--onacc);background:var(--gold);border-radius:99px;padding:7px 13px;flex:none}
.gteaser:not(.hot) .gtgo{background:transparent;color:var(--gold);font-size:24px;padding:0 4px}
@keyframes teaserglow{0%,100%{box-shadow:0 0 0 0 rgba(255,143,171,0)}50%{box-shadow:0 0 20px 3px rgba(255,143,171,.4)}}
.gfab{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--gold);color:var(--onacc);font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.55);z-index:15;cursor:pointer}
.gfab.hot{animation:fabpulse 1.3s ease-in-out infinite}
@keyframes fabpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

.game{margin-top:34px;border-top:1px solid var(--plum2);padding-top:18px;scroll-margin-top:12px}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:linear-gradient(135deg,var(--plum2),var(--plum));border:1px solid var(--gold);border-radius:16px;padding:16px;color:var(--gold);font-family:var(--serif);font-size:21px;font-weight:700;cursor:pointer;text-align:left}
html[data-theme=latex] .ghead,html[data-theme=hard] .ghead{font-family:var(--sans);font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.gh1{flex:1;display:flex;align-items:center;gap:10px}
.gh-ic{font-size:26px;line-height:1}
.gchev{transition:transform .25s;font-size:16px;color:var(--steel)}
.game.open .gchev{transform:rotate(180deg)}
.gdot{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--rose);white-space:nowrap}
.gbody{display:none;margin-top:14px}
.game.open .gbody{display:block;animation:gfade .3s ease-out}
@keyframes gfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.gturn{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px auto 4px;padding:10px 16px;border-radius:99px;border:1px solid var(--plum2);background:var(--plum);font-family:var(--serif);font-size:22px;font-weight:700;color:var(--gold);width:fit-content;max-width:100%}
.gturn.me{border-color:var(--rose);color:var(--rose);animation:teaserglow 1.6s ease-in-out infinite}
html[data-theme=latex] .gturn,html[data-theme=hard] .gturn{font-family:var(--sans);font-size:15px;font-weight:800;letter-spacing:.12em}
.gturn-ic{display:inline-flex;font-size:20px}
.gmodetag{text-align:center;color:var(--steel);font-size:13px;letter-spacing:.18em;margin-bottom:2px}
.gdice{width:88px;height:88px;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1;border:2px solid var(--gold);border-radius:20px;color:var(--gold);background:radial-gradient(circle at 30% 25%,var(--plum2),var(--plum))}
.gdice.roll{animation:droll .45s linear infinite}
.gdice.pop{animation:dpop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes droll{0%{transform:rotate(0) scale(1)}25%{transform:rotate(90deg) scale(1.14)}50%{transform:rotate(180deg) scale(1)}75%{transform:rotate(270deg) scale(1.14)}100%{transform:rotate(360deg) scale(1)}}
@keyframes dpop{0%{transform:scale(.7)}100%{transform:scale(1)}}

.gprog{display:grid;gap:6px;margin:10px 0 0}
.pr{display:flex;align-items:center;gap:8px;font-size:13px}
.pr .pri{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;flex:none}
.pr.g .pri{background:#dc143c;color:#fff}.pr.s .pri{background:#6e0b1a;color:#ffd9d9;border:1px solid #c0394d}
.pr .bar{flex:1;height:8px;border-radius:99px;background:var(--plum2);overflow:hidden}
.pr .bar i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.pr.g .bar i{background:linear-gradient(90deg,#8e0f2a,#ff5b79)}.pr.s .bar i{background:linear-gradient(90deg,#4a0710,#d4546a)}
.pr b{width:24px;text-align:right;font-variant-numeric:tabular-nums}

.gboard{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:14px 0;padding:8px;border-radius:18px;background:var(--plum);border:1px solid var(--plum2)}
.gc{position:relative;aspect-ratio:1;border:1.5px solid var(--plum2);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background-image:linear-gradient(160deg,rgba(255,255,255,.08),rgba(0,0,0,.2))}
.gc:active{filter:brightness(1.3)}
.gc.sp{border-width:2.5px}
.gc.hg{box-shadow:inset 0 0 0 2px #dc143c}
.gc.hs{box-shadow:inset 0 0 0 2px #c0394d}
.gc.hg.hs{box-shadow:inset 0 0 0 2px #dc143c,inset 0 0 0 4px #c0394d}
.gc.land{animation:land 1s ease-out}
@keyframes land{0%{transform:scale(1);filter:brightness(1)}20%{transform:scale(1.14);filter:brightness(1.9)}100%{transform:scale(1);filter:brightness(1)}}
.gn{position:absolute;top:3px;left:5px;font-size:10px;color:var(--steel)}
.gstar{position:absolute;top:2px;right:4px;font-size:9px;color:var(--gold)}
.gi{font-size:20px;line-height:1}
.gtok{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:3;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.55);transition-property:transform;transition-duration:.6s;transition-timing-function:cubic-bezier(.3,.8,.3,1)}
.gti{display:inline-flex}
.gtok.hop .gti{animation:hop .17s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.2)}100%{transform:translateY(0) scale(1)}}
.gtok.g{background:#dc143c;color:#fff;border:1.5px solid #ff8da1}
.gtok.s{background:#6e0b1a;color:#ffd9d9;border:1.5px solid #c0394d}
.gtok.act::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;animation:ring 1.3s ease-out infinite}

.glegbtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:1px solid var(--plum2);border-radius:12px;padding:12px 14px;color:var(--ivory);font:inherit;font-size:15px;cursor:pointer}
.gleg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gli{display:flex;align-items:center;gap:8px;background:var(--plum);border:1px solid var(--plum2);border-radius:12px;padding:8px}
.gli>div{min-width:0;line-height:1.2}
.gli b{display:block;font-size:12px}
.gli small{display:block;font-size:11px;color:var(--steel)}
.gls{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.gmini{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.gmini.g{background:#dc143c;color:#fff;border:1.5px solid #ff8da1}
.gmini.s{background:#6e0b1a;color:#ffd9d9;border:1.5px solid #c0394d}

.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gmenu{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.gmodal{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;animation:gfade .2s ease-out}
.gsheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--plum);border:1px solid var(--gold);border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:sheetup .3s cubic-bezier(.2,.9,.3,1)}

.gsh1{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.gsi{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.gsc{font-weight:700;font-size:15px}
.gst{font-family:var(--serif);font-size:28px;line-height:1.15;margin:4px 0 8px;word-break:break-word}

function ic(n){ return '<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>'; }
function brand(){
  const T = THEMES[theme];
  return '<h1 class="brand"><span class="orn">'+ic(T.orn[0])+'</span>'+(theme==='cuck'?'Goddess':APP_NAME)+'<span class="orn">'+ic(T.orn[1])+'</span></h1>';
}
function makeIcon(size){
  const T = THEMES[theme];
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,size,size);
  g.addColorStop(0,T.bg[0]); g.addColorStop(1,T.bg[1]);
  x.fillStyle = g; x.fillRect(0,0,size,size);
  x.strokeStyle = T.acc; x.lineWidth = size*0.025;
  x.beginPath(); x.arc(size/2,size/2,size*0.34,0,Math.PI*2); x.stroke();
  x.fillStyle = T.acc; x.font = '600 '+(size*0.46)+'px Georgia,serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(T.glyph, size/2, size/2 + size*0.03);
  return c.toDataURL('image/png');
}
function buildIcons(){
  try{
    ['gd-icon','gd-manifest'].forEach(id=>{ const e=document.getElementById(id); if(e) e.remove(); });
    const T = THEMES[theme];
    const l = document.createElement('link'); l.id='gd-icon'; l.rel='apple-touch-icon'; l.href=makeIcon(180); document.head.appendChild(l);
    const m = {name:APP_NAME, short_name:APP_NAME, display:'standalone', background_color:T.ink, theme_color:T.ink,
      start_url: location.href.split('#')[0].split('?')[0],
      icons:[{src:makeIcon(192),sizes:'192x192',type:'image/png'},{src:makeIcon(512),sizes:'512x512',type:'image/png'}]};
    const mf = document.createElement('link'); mf.id='gd-manifest'; mf.rel='manifest';
    mf.href = URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    document.head.appendChild(mf);
  }catch(e){}
}
function applyTheme(){

}

async function sha(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('gd:'+s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function pinPad(title, cb){
  let v = '';
  app.innerHTML = '<div class="center">'+brand()+'<p class="tag">'+esc(THEMES[theme].tag)+'</p><p class="muted">'+esc(title)+'</p>'+
    '<div class="dots">'+'<i></i>'.repeat(4)+'</div>'+
    '<div class="pad">'+[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':'<button data-k="'+k+'">'+k+'</button>').join('')+'</div></div>';
  const upd = () => document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<v.length));
  document.querySelector('.pad').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    const k = b.dataset.k;
    if(k==='⌫') v = v.slice(0,-1); else if(v.length<4) v += k;
    upd();
    if(v.length===4){ const p=v; v=''; setTimeout(()=>{ upd(); cb(p); },120); }
  };
}
function setPin(next){
  pinPad('Scegli un PIN di 4 cifre', p1 => {
    pinPad('Ripeti il PIN', async p2 => {
      if(p1!==p2){ toast('I PIN non coincidono'); setPin(next); return; }
      localStorage.setItem(PINKEY, await sha(p1)); next();
    });
  });
}
function unlock(next){
  pinPad('Inserisci il PIN', async p => {
    if(await sha(p) === localStorage.getItem(PINKEY)){ tries=0; next(); }
    else { tries++; if(tries>=5){ await logout(); return; } toast('PIN errato'); unlock(next); }
  });
}

/* ---------- NOTIFICHE PUSH ---------- */
function pushOK(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }
function standalone(){ return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function swReady(){
  return Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(()=>r(null),2000))]);
}
function b64u(s){
  const p = '='.repeat((4 - s.length % 4) % 4);
  const r = atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));
  const o = new Uint8Array(r.length);
  for(let i=0;i<r.length;i++) o[i] = r.charCodeAt(i);
  return o;
}
async function syncPush(){
  if(!pushOK() || Notification.permission!=='granted' || !uid) return;
  try{
    const reg = await swReady(); if(!reg) return;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(VAPID_PUBLIC)});
    const j = sub.toJSON();
    await sb.from('push_subs').upsert({user_id:uid, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth},{onConflict:'endpoint'});
  }catch(e){}
}
async function enablePush(){
  try{
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ toast('Notifiche non attivate'); render(); return; }
    await syncPush(); toast('Notifiche attivate'); render();
  }catch(e){ toast('Notifiche non disponibili su questo dispositivo'); }
}
function pushBanner(){
  if(!pushOK()){
    if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone())
      return '<p class="banner">Per ricevere le notifiche aggiungi l\'app alla schermata Home e aprila da lì.</p>';
    return '';
  }
  if(Notification.permission==='default') return '<button class="banner" data-a="push">🔔 Attiva le notifiche</button>';
  if(Notification.permission==='denied') return '<p class="banner">Notifiche bloccate: riattivale dalle impostazioni del telefono.</p>';
  return '';
}

async function refreshTimers(notify){
  const before = timers.map(t=>t.id+t.fase).join();
  if(!await loadTimers()) return;
  const sg = timersSignature();
  if(sg===tsig) return;
  tsig = sg;
  if(notify && !locked && before!==timers.map(t=>t.id+t.fase).join()) buzz();
  if(locked || ui.step==='timerform') return;
  if(typing()){ pendingRender = true; return; }
  render();
}
function tState(t){
  const n = now();
  if(t.fase==='attesa') return new Date(t.scade_a).getTime() > n ? 'attesa' : 'ritardo';
  if(t.fase==='chiuso') return new Date(t.fine_at).getTime() > n ? 'chiuso' : 'libero';
  return 'libero';
}
function fmtLong(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), x = s%60;
  const p = n => String(n).padStart(2,'0');
  return (d ? d+'g ' : '')+p(h)+':'+p(m)+':'+p(x);
}
function tickTimers(){
  let exp = false;
  document.querySelectorAll('.tcount').forEach(el=>{
    const e = new Date(el.dataset.texp).getTime();
    if(el.dataset.tmode==='down'){
      const left = e - now();
      if(left<=0){ el.textContent = '00:00:00'; exp = true; }
      else el.textContent = fmtLong(left);
    } else el.textContent = '+'+fmtLong(now()-e);
  });
  if(exp && !tFlag && !locked && ui.step!=='timerform'){
    tFlag = true; setTimeout(()=>{ tFlag = false; }, 3000);
    if(!typing()) render();
  }
}
function cagePic(){ return '<svg class="cagepic" aria-hidden="true"><use href="#i-cagepic"/></svg>'; }

  let lab = '', count = '', sub = '';

    lab = t.frase_a;
    count = '<div class="tcount" data-texp="'+esc(t.scade_a)+'" data-tmode="down">--:--:--</div>';
    sub = slave ? 'Quando sei chiuso, invia la foto per fermare il timer.' : 'In attesa che lui si ingabbi e invii la foto.';
  } else if(st==='ritardo'){
    lab = t.frase_a+' · tempo scaduto';
    count = '<div class="tcount late" data-texp="'+esc(t.scade_a)+'" data-tmode="up">+00:00:00</div>';
    sub = slave ? 'Sei in ritardo: ingabbiati e invia la foto subito.' : 'È in ritardo.';
  } else if(st==='chiuso'){
    lab = t.frase_b;
    count = '<div class="tcount" data-texp="'+esc(t.fine_at)+'" data-tmode="down">--:--:--</div>';
    sub = 'Chiuso dal '+fdate(t.chiuso_at)+'.';
  } else {
    lab = slave ? 'Puoi sgabbiarti' : 'Può sgabbiarsi';

  }
  let h = '<div class="tcard st-'+st+'"><div class="trow1"><div class="timg">'+cagePic()+'</div><div class="tbody">'+
    '<div class="tlab">'+esc(lab)+'</div>'+count+'<div class="tsub">'+sub+'</div></div></div>';
  if(!slave && t.foto_path && (st==='chiuso' || st==='libero'))
    h += '<div class="media" data-path="'+esc(t.foto_path)+'" data-tipo="image"></div>';
  if(slave && (st==='attesa' || st==='ritardo')){
    h += '<label class="btn ghost block">Scatta la foto con la gabbia<input type="file" id="tf" accept="image/*" capture hidden></label><div id="tprev"></div>'+
      '<button class="btn block" data-a="tsend" data-id="'+t.id+'">Invia la foto alla Dea</button>';
  }
  if(slave && st==='chiuso') h += '<button class="link" data-a="temer" data-id="'+t.id+'">Emergenza: devo sgabbiarmi subito</button>';
  if(!slave){
    h += '<div><button class="link" data-a="tedit" data-id="'+t.id+'">Modifica</button>'+
      (st==='chiuso' ? '<button class="link red" data-a="treject" data-id="'+t.id+'">Rifiuta la foto</button>' : '')+
      '<button class="link red" data-a="tdel" data-id="'+t.id+'">'+(st==='libero' ? 'Concludi' : 'Elimina')+'</button></div>';

async function saveTimer(){
  const num = sel => Math.max(0, parseInt(($(sel)||{}).value, 10) || 0);
  const t = ui.tid ? timers.find(x=>x.id===ui.tid) : null;
  const st = t ? tState(t) : 'nuovo';
  const closed = (st==='chiuso' || st==='libero');
  const fb = (($('#tfb').value)||'').trim() || 'Tra quanto potrai sgabbiarti';
  const mB = num('#tbd')*1440 + num('#tbh')*60 + num('#tbm');
  if(mB<1 || mB>43200) return toast('Durata della chiusura: da 1 minuto a 30 giorni');
  let row, mA = 0;
  if(closed){
    row = {frase_b:fb, fine_at:new Date(now()+mB*60000).toISOString(), notif_b:false};
  } else {
    const fa = (($('#tfa').value)||'').trim() || 'Preparati a ingabbiarti';
    mA = num('#tah')*60 + num('#tam');
    if(mA<1) return toast('Tempo per ingabbiarsi: almeno 1 minuto');
    row = {frase_a:fa, frase_b:fb, scade_a:new Date(now()+mA*60000).toISOString(), durata_b_min:mB};
    if(t) row.notif_a = false;
  }
  const btn = $('[data-a=tsave]'); btn.disabled = true;
  const res = t ? await sb.from('timer_cast').update(row).eq('id', t.id).select().single()
                : await sb.from('timer_cast').insert(row).select().single();
  if(res.error){ btn.disabled = false; return toast('Non riuscito, riprova'); }
  if(res.data){
    const i = timers.findIndex(x=>x.id===res.data.id);
    if(i>=0) timers[i] = res.data; else timers.unshift(res.data);
  }
  tsig = timersSignature(); ui = {step:'home'}; render(); toast('Timer salvato');
}

async function delTimer(id){
  const t = timers.find(x=>x.id===id); if(!t) return;
  if(!confirm('Eliminare questo timer?')) return;
  timers = timers.filter(x=>x.id!==id); tsig = timersSignature(); render();
  try{
    if(t.foto_path) await sb.storage.from('media').remove([t.foto_path]);
    const r = await sb.from('timer_cast').delete().eq('id', id);
    if(r.error) throw r.error;
  }catch(e){ toast('Eliminazione non riuscita'); refreshTimers(false); }
}

async function rejectTimer(id){
  const t = timers.find(x=>x.id===id); if(!t) return;
  if(!confirm('Rifiutare la foto? Il timer torna in attesa per 10 minuti.')) return;
  const path = t.foto_path;
  const r = await sb.from('timer_cast').update({fase:'attesa', foto_path:null, chiuso_at:null, fine_at:null,
    scade_a:new Date(now()+10*60000).toISOString(), notif_a:false, notif_b:false}).eq('id', id).select().single();
  if(r.error) return toast('Non riuscito, riprova');
  if(path){ try{ await sb.storage.from('media').remove([path]); }catch(e){} }
  const i = timers.findIndex(x=>x.id===id); if(i>=0 && r.data) timers[i] = r.data;
  tsig = timersSignature(); render(); toast('Foto rifiutata');
}

async function sendTimerPhoto(id){
  const t = timers.find(x=>x.id===id); if(!t) return;
  let f = pendingTFile;
  if(!f) return toast('Scatta prima la foto con la gabbia');
  const b = $('[data-a=tsend]'); b.disabled = true; b.textContent = 'Invio in corso...';
  try{
    f = await shrinkImage(f);
    if(f.size > MAX_BYTES){ b.disabled=false; b.textContent='Invia la foto alla Dea'; return toast('File troppo grande'); }
    const ext = (f.type==='image/png') ? 'png' : 'jpg';
    const path = 'timer/'+id+'/'+Date.now()+'.'+ext;
    const up = await sb.storage.from('media').upload(path, f, {contentType: f.type || 'image/jpeg'});
    if(up.error) throw up.error;
    const r = await sb.rpc('timer_foto',{p_id:id, p_path:path});
    if(r.error) throw r.error;
    t.fase = 'chiuso'; t.foto_path = path; t.chiuso_at = new Date(now()).toISOString();
    t.fine_at = new Date(now() + t.durata_b_min*60000).toISOString();
    pendingTFile = null; tsig = timersSignature(); render(); toast('Foto inviata alla Dea');
    refreshTimers(false);
  }catch(e){
    toast('Invio non riuscito, riprova'); b.disabled = false; b.textContent = 'Invia la foto alla Dea';
  }
}

async function emerTimer(id){
  const t = timers.find(x=>x.id===id); if(!t) return;
  if(!confirm('Sgabbiarti adesso? La Dea viene avvisata subito.')) return;
  const old = t.fine_at;
  t.fine_at = new Date(now()).toISOString(); tsig = timersSignature(); render();
  const r = await sb.rpc('timer_emergenza',{p_id:id});
  if(r.error){ t.fine_at = old; tsig = timersSignature(); render(); toast('Non riuscito, riprova'); }
  else toast('La Dea è stata avvisata');
}

/* ---------- MESSAGGI LAMPO ---------- */
async function loadMsgs(){
  const r = await sb.from('messaggi').select('*').order('created_at',{ascending:false}).limit(60);
  if(r.error) return false;
  msgs = r.data; return true;
}
function unreadMsgs(){ return msgs.filter(m=>m.da!==role && !m.letto_at && !seen.has(m.id)); }

async function refreshMsgs(notify){
  const before = {};
  msgs.forEach(m=>{ before[m.id] = m.mi_piace; });
  if(!await loadMsgs()) return;
  if(notify && !locked){
    const fresh = unreadMsgs().filter(m=>!(m.id in before));
    const liked = msgs.filter(m=>m.da===role && m.mi_piace && before[m.id]===false);
    if(fresh.length) buzz();
    if(liked.length){ buzz(); toast('❤️ Mi piace al tuo messaggio'); }
  }
  if(!locked && ui.step==='msgs' && !typing()) render();
  checkPopups();
}

function checkPopups(){
  if(locked || !role || popupId || document.hidden) return;
  const q = unreadMsgs().filter(m=>!shownMsgs.has(m.id)).reverse();
  if(q.length) showPopup(q[0]);
}

function showPopup(m){
  popupId = m.id; shownMsgs.add(m.id);
  const from = m.da==='padrona' ? 'La tua Dea' : 'Il tuo schiavo';
  const P = $('#popup');
  P.innerHTML = '<div class="pcard"><p class="pfrom">'+from+'</p><div class="pemoji">'+esc(m.emoji||'💬')+'</div>'+
    '<p class="ptext">'+esc(m.testo)+'</p>'+
    '<div class="prow"><button class="btn'+(m.mi_piace?'':' ghost')+'" data-p="like">'+(m.mi_piace?'❤️ Piaciuto':'🤍 Mi piace')+'</button>'+
    '<button class="btn ghost" data-p="reply">↩ Rispondi</button></div>'+
    '<button class="link" data-p="close">Chiudi</button></div>';
  P.hidden = false;
}
function popupReply(){
  const P = $('#popup');
  P.innerHTML = '<div class="pcard"><p class="pfrom">Rispondi</p><div class="plist">'+
    QM[role].map((q,i)=>'<button class="opt chip" data-p="rq" data-i="'+i+'"><span>'+q.e+'</span> '+esc(q.t)+'</button>').join('')+'</div>'+
    '<textarea id="prt" rows="2" maxlength="300" placeholder="Oppure scrivi la tua risposta"></textarea>'+
    '<button class="btn block" data-p="rsend">Invia risposta</button>'+
    '<button class="link" data-p="rback">‹ Indietro</button></div>';
}
function closePopup(){
  const m = msgs.find(x=>x.id===popupId);
  if(m && m.da!==role){
    markSeen(m.id);
    if(!m.letto_at){
      m.letto_at = new Date().toISOString();
      sb.rpc('msg_letto',{p_id:m.id}).then(()=>{}, ()=>{});
    }
  }
  const P = $('#popup'); P.hidden = true; P.innerHTML = '';
  popupId = null;
  if(!locked && ui.step==='msgs') render();
  setTimeout(checkPopups, 250);
}
function lockHidePopup(){
  if(!popupId) return;
  shownMsgs.delete(popupId); popupId = null;
  const P = $('#popup'); P.hidden = true; P.innerHTML = '';
}
async function sendMsg(def, txt, replyTo){
  const row = {da:role, codice:def?def.id:'custom', emoji:def?def.e:'💬', testo:def?def.t:txt, risposta_a:replyTo||null};
  const r = await sb.from('messaggi').insert(row).select().single();
  if(r.error){ toast('Invio non riuscito, riprova'); return false; }
  if(r.data) msgs.unshift(r.data);
  return true;
}
async function sendQuick(i){
  const def = QM[role][i]; if(!def) return;
  if(await sendMsg(def, null, null)){ toast('Inviato: '+def.t); if(ui.step==='msgs') render(); }
}
async function delMsg(id){
  msgs = msgs.filter(x=>x.id!==id); render();
  const r = await sb.from('messaggi').delete().eq('id', id);
  if(r.error){ toast('Eliminazione non riuscita'); refreshMsgs(false); }
}
async function toggleLike(){
  const m = msgs.find(x=>x.id===popupId); if(!m) return;
  m.mi_piace = !m.mi_piace;
  showPopup(m);
  sb.rpc('msg_mi_piace',{p_id:m.id, p_val:m.mi_piace}).then(r=>{ if(r && r.error) toast('Mi piace non inviato'); }, ()=>{});
}
$('#popup').addEventListener('click', async e => {
  const P = $('#popup');
  if(e.target===P) return closePopup();
  const b = e.target.closest('[data-p]'); if(!b) return;
  const a = b.dataset.p;
  if(a==='close') return closePopup();
  if(a==='like') return toggleLike();
  if(a==='reply') return popupReply();
  if(a==='rback'){ const m = msgs.find(x=>x.id===popupId); if(m) showPopup(m); return; }
  if(a==='rq'){
    const def = QM[role][parseInt(b.dataset.i,10)]; if(!def) return;
    if(await sendMsg(def, null, popupId)){ toast('Risposta inviata'); closePopup(); }
    return;
  }
  if(a==='rsend'){
    const t = ($('#prt').value||'').trim();
    if(!t) return toast('Scrivi qualcosa');
    if(await sendMsg(null, t, popupId)){ toast('Risposta inviata'); closePopup(); }
  }
});

function signature(){ return orders.map(o=>[o.id,o.stato,o.scade_at,o.rinvii,o.penitenza_di].join(':')).join(','); }

/* stato derivato: done / expired / pending */
function stat(o){
  if(o.stato==='completato') return 'done';
  if(o.categoria!=='penitenza' && o.scade_at && new Date(o.scade_at).getTime() <= now()) return 'expired';
  return 'pending';
}
function hasPen(o){ return orders.some(p=>p.penitenza_di===o.id); }
function lists(){
  const pending=[], needPen=[], archive=[];
  orders.forEach(o=>{
    const s = stat(o);
    if(s==='pending') pending.push(o);
    else if(s==='done') archive.push(o);
    else if(hasPen(o)) archive.push(o);
    else needPen.push(o);
  });
  return {pending, needPen, archive};
}
function curOrder(){
  if(ui.step==='detail'){
    const o = orders.find(x=>x.id===ui.id);
    if(o && stat(o)==='pending') return o;
  }
  return lists().pending.slice().reverse()[0];
}

async function refresh(notify){
  const prev = orders.slice();
  if(!await loadOrders()) return;
  const s = signature();
  if(s === sig) return;
  sig = s;
  if(notify){
    if(role==='schiavo' && orders.some(o=>o.stato==='in_attesa' && !prev.find(p=>p.id===o.id))){ buzz(); toast('Nuovo ordine dalla Padrona'); }
    if(role==='padrona' && orders.some(o=>o.stato==='completato' && prev.find(p=>p.id===o.id && p.stato==='in_attesa'))){ buzz(); toast('Il tuo schiavo ha risposto'); }
  }
  if(locked) return;
  if(typing()){ pendingRender = true; return; }
  render();
}
function startLive(){
  stopLive();
  channel = sb.channel('ordini-live').on('postgres_changes',{event:'*',schema:'public',table:'ordini'},()=>{
    clearTimeout(rtT); rtT = setTimeout(()=>refresh(true), 350);
  }).on('postgres_changes',{event:'*',schema:'public',table:'messaggi'},()=>{
    clearTimeout(rtM); rtM = setTimeout(()=>refreshMsgs(true), 300);
  }).on('postgres_changes',{event:'*',schema:'public',table:'timer_cast'},()=>{
    clearTimeout(rtC); rtC = setTimeout(()=>refreshTimers(true), 300);
  }).subscribe();
  poll = setInterval(()=>{ if(!document.hidden && !locked){ refresh(true); refreshMsgs(true); refreshTimers(true); gRefresh(); } }, 25000);
}
function stopLive(){ if(channel){ sb.removeChannel(channel); channel=null; } if(poll){ clearInterval(poll); poll=null; } }

async function boot(){
  const s0 = await sb.auth.getSession();
  uid = s0.data.session ? s0.data.session.user.id : null;
  /* prima schermata subito, dai dati salvati; poi si aggiorna */
  const c = readCache();
  if(c && c.uid===uid && c.role){ role = c.role; orders = c.orders || []; sig = signature(); render(); }
  const res = await Promise.all([sb.from('ruoli').select('ruolo').maybeSingle(), loadOrders(), loadMsgs(), loadTimers()]);
  const rl = res[0];
  if(rl.error){
    if(!role){ toast('Connessione assente, riprovo...'); setTimeout(boot, 4000); return; }
  } else if(!rl.data){
    toast('Accesso non autorizzato'); await logout(); return;
  } else {
    role = rl.data.ruolo;
  }
  sig = signature(); tsig = timersSignature(); writeCache();
  startLive(); render();
  syncPush(); syncClock(); applyTarget(); checkPopups(); gInit();
}

  const src = o.penitenza_di ? orders.find(x=>x.id===o.penitenza_di) : null;

  if(s==='done'){

    else if(o.risposta_tipo==='ok') val = '<div class="val"><b>Obbedisce.</b></div>';
    else if(o.risposta_testo) val = '<div class="val">'+esc(o.risposta_testo)+'</div>';
    const media = o.risposta_media ? '<div class="media" data-path="'+esc(o.risposta_media)+'" data-tipo="'+esc(o.risposta_tipo)+'"></div>' : '';
    r = '<div class="resp"><div class="lab">Risposta · '+fdate(o.risposta_at)+'</div>'+val+media+'</div>';

              : '<span class="badge">In attesa</span>';

    btns += '<button class="link red" data-a="del" data-id="'+o.id+'">'+(s==='pending'?'Annulla ordine':'Elimina')+'</button>';

async function hydrate(){
  const els = Array.from(document.querySelectorAll('[data-path]'));
  if(!els.length) return;
  const fill = () => els.forEach(el=>{
    if(el.dataset.done) return;
    const e = urlCache[el.dataset.path]; if(!e || !e.url) return;
    const t = el.dataset.tipo;
    el.innerHTML = t==='video' ? '<video src="'+e.url+'" controls playsinline preload="none"></video>'
                 : t==='image' ? '<img src="'+e.url+'" alt="" loading="lazy" decoding="async">'
                 : '<a href="'+e.url+'" target="_blank" rel="noopener">Apri il file</a>';
    el.dataset.done = '1';
  });
  fill();
  const need = Array.from(new Set(els.map(el=>el.dataset.path).filter(p=>{
    const e = urlCache[p]; return !e || Date.now()-e.t > 50*60*1000;
  })));
  if(!need.length) return;
  try{
    const r = await sb.storage.from('media').createSignedUrls(need, 3600);
    (r.data || []).forEach(d=>{ if(d && d.signedUrl) urlCache[d.path] = {url:d.signedUrl, t:Date.now()}; });
  }catch(e){}
  fill();
}

function tick(){
  tickTimers();
  let expired = false;
  document.querySelectorAll('.timer').forEach(el=>{
    const left = new Date(el.dataset.exp).getTime() - now();
    if(left<=0){ el.textContent = 'Scaduto'; expired = true; }
    else el.textContent = fmt(left);
  });
  if(expired && !expFlag && !locked){
    expFlag = true; sig = '';
    refresh(false);
    setTimeout(()=>{ expFlag = false; }, 5000);
  }
}

async function applyTarget(){
  if(!role || locked) return;
  if(openGame){
    openGame = false; gOpen = true;
    try{ localStorage.setItem('gd_gopen','1'); }catch(e){}
    ui = {step:'home'}; render();
    setTimeout(function(){ const el = document.getElementById('game'); if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth'}); }, 150);
  }
  if(openMsg){

    if(mm && mm.da!==role){ shownMsgs.delete(mid); showPopup(mm); }
    else { ui = {step:'msgs'}; render(); }

  ui = {step:'detail', id:id};

async function shrinkImage(f){
  if(!f.type || f.type.indexOf('image/')!==0 || f.type==='image/gif') return f;
  try{
    let bmp;
    try{ bmp = await createImageBitmap(f, {imageOrientation:'from-image'}); }
    catch(e){ bmp = await createImageBitmap(f); }
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if(sc===1 && f.size < 1.2*1024*1024) return f;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
    return blob ? new File([blob], 'foto.jpg', {type:'image/jpeg'}) : f;
  }catch(e){ return f; }
}

async function sendOrder(){
  let testo = ($('#ot').value||'').trim();
  if(!testo) return toast('Scrivi qualcosa');
  const tiped = TIPED.indexOf(ui.cat)>=0;
  const tipo = tiped ? ui.sub : 'custom';
  if(ui.cat==='sfida'){
    const num = (($('#onum')||{}).value||'').trim();
    if(/\{numero\}/i.test(testo)){
      if(!num) return toast('Inserisci il numero di telefono');
      testo = testo.replace(/\{numero\}/gi, num);
    }
  }
  if(/\+?\d[\d\s().-]{7,}\d/.test(testo) &&
     !confirm("Nell'ordine c'è un numero di telefono. Quella persona sa del gioco ed è d'accordo a riceverlo?")) return;
  const mins = parseInt(($('#otm')||{}).value, 10) || 10;
  const nr = !!($('#onr') && $('#onr').checked);
  const pen = (($('#oap')||{}).value||'').trim();
  const row = {categoria:ui.cat, tipo, testo, scade_at:new Date(now()+mins*60000).toISOString(), rinviabile:!nr};
  if(pen){ row.pen_tipo = ($('#opt')||{}).value || 'custom'; row.pen_testo = pen; }
  const b = $('[data-a=order]'); b.disabled = true;
  const r = await sb.from('ordini').insert(row).select().single();
  if(r.error){ b.disabled=false; return toast('Invio non riuscito, riprova'); }
  if(r.data) orders.unshift(r.data);
  sig = signature(); writeCache();
  toast('Ordine inviato'); ui = {step:'home'}; render();
}

async function sendPen(){
  const t = ($('#ot').value||'').trim();
  if(!t) return toast('Scrivi la penitenza');
  const b = $('[data-a=penorder]'); b.disabled = true;
  const r = await sb.rpc('assegna_penitenza',{p_scaduto:ui.src||null, p_tipo:$('#pt').value, p_testo:t});
  if(r.error){ b.disabled=false; return toast('Non riuscito, riprova'); }
  toast('Penitenza assegnata'); ui = {step:'home'}; render();
  sig=''; refresh(false);
}

async function delOrder(id){
  const o = orders.find(x=>x.id===id); if(!o) return;
  if(!confirm('Eliminare definitivamente questa richiesta?')) return;
  orders = orders.filter(x=>x.id!==id); sig = signature(); writeCache();
  if(ui.step==='detail') ui = {step:'home'};
  render(); toast('Eliminata');
  try{
    if(o.risposta_media) await sb.storage.from('media').remove([o.risposta_media]);
    const r = await sb.from('ordini').delete().eq('id', id);
    if(r.error) throw r.error;
  }catch(e){ toast('Eliminazione non riuscita'); sig=''; refresh(false); }
}

async function answer(o, testo, path, tipo){
  const r = await sb.rpc('rispondi',{p_id:o.id, p_testo:testo, p_media:path, p_tipo:tipo});
  if(r.error) throw r.error;
}
function isExpiredErr(e){ return /scaduto/i.test(String(e && e.message)); }

async function replyChoice(kind, val){
  const o = curOrder(); if(!o) return;
  const testo = kind==='yn' ? val : 'Obbedisco', tipo = kind==='yn' ? 'scelta' : 'ok';
  const snap = Object.assign({}, o);
  localDone(o, testo, null, tipo); sig = signature(); ui = {step:'home'}; render(); toast('Inviato alla Padrona');
  try{ await answer(o, testo, null, tipo); writeCache(); }
  catch(e){
    Object.assign(o, snap); sig = signature(); render();
    toast(isExpiredErr(e) ? 'Tempo scaduto' : 'Invio non riuscito, riprova');
    sig=''; refresh(false);
  }
}

async function sendReply(){
  const o = curOrder(); if(!o) return;
  const rt = ($('#rt') ? $('#rt').value : '').trim();
  let f = pendingFile;
  const c = o.categoria, t = o.tipo;
  const isObb = (TIPED.indexOf(c)>=0 || c==='penitenza');
  if(c==='verita' && !rt) return toast('Scrivi la risposta');
  if(isObb && t!=='custom' && !f) return toast('Allega quanto richiesto');
  if(isObb && t==='custom' && !rt && !f) return toast('Rispondi o allega qualcosa');
  const b = $('#sendbtn'); b.disabled = true; b.textContent = 'Invio in corso...';
  try{
    let path = null, tipo = 'testo';
    if(f){
      f = await shrinkImage(f);
      if(f.size > MAX_BYTES){ b.disabled=false; b.textContent='Invia alla Padrona'; return toast('File troppo grande (max 50 MB)'); }
      const ext = ((f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)) || 'bin';
      path = o.id+'/'+Date.now()+'.'+ext;
      const up = await sb.storage.from('media').upload(path, f, {contentType: f.type || undefined});
      if(up.error) throw up.error;
      tipo = f.type.indexOf('video')===0 ? 'video' : f.type.indexOf('image')===0 ? 'image' : 'file';
    }
    await answer(o, rt || null, path, tipo);
    localDone(o, rt || null, path, tipo);
    pendingFile = null; sig = signature(); writeCache(); ui = {step:'home'}; render(); toast('Inviato alla Padrona');
  }catch(e){
    if(isExpiredErr(e)){ toast('Tempo scaduto'); sig=''; await refresh(false); render(); return; }
    toast('Invio non riuscito, riprova'); b.disabled=false; b.textContent='Invia alla Padrona';
  }
}

async function rinvia(){
  const o = curOrder(); if(!o) return;
  const snap = {scade_at:o.scade_at, rinvii:o.rinvii};
  o.scade_at = new Date(new Date(o.scade_at).getTime() + 10*60*1000).toISOString();
  o.rinvii = (o.rinvii||0) + 1;
  sig = signature(); render(); toast('Rinviato di 10 minuti');
  const r = await sb.rpc('rinvia',{p_id:o.id});
  if(r.error){ Object.assign(o, snap); sig = signature(); render(); toast('Non rinviabile'); sig=''; refresh(false); }
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a;
  if(a==='logout') return logout();
  if(a==='push') return enablePush();
  if(a==='settings'){ ui = {step:'settings'}; return render(); }
  if(a==='theme'){ setTheme(b.dataset.t); return render(); }
  if(a==='pack'){ pack = b.dataset.p; try{ localStorage.setItem('gd_pack', pack); }catch(x){} toast('Livello: '+PACKS[pack].nome); return render(); }
  if(a==='tnew'){ ui = {step:'timerform', tid:null}; return render(); }
  if(a==='tedit'){ ui = {step:'timerform', tid:b.dataset.id}; return render(); }
  if(a==='tsave') return saveTimer();
  if(a==='tdel') return delTimer(b.dataset.id);
  if(a==='treject') return rejectTimer(b.dataset.id);
  if(a==='tsend') return sendTimerPhoto(b.dataset.id);
  if(a==='temer') return emerTimer(b.dataset.id);
  if(a==='tpa'){ const m = parseInt(b.dataset.m,10); $('#tah').value = Math.floor(m/60); $('#tam').value = m%60; return; }
  if(a==='tpb'){ const m = parseInt(b.dataset.m,10); $('#tbd').value = Math.floor(m/1440); $('#tbh').value = Math.floor(m%1440/60); $('#tbm').value = m%60; return; }
  if(a==='gopen') return gGoto();
  if(a==='msgs'){ ui = {step:'msgs'}; return render(); }
  if(a==='qm') return sendQuick(parseInt(b.dataset.i,10));
  if(a==='openmsg'){ const mm = msgs.find(x=>x.id===b.dataset.id); if(mm) showPopup(mm); return; }
  if(a==='delmsg') return delMsg(b.dataset.id);
  if(a==='cat'){
    ui = {step:'home', cat:b.dataset.c};
    if(CATS[ui.cat].sub.length===1){ ui.sub = CATS[ui.cat].sub[0][0]; ui.step='compose'; } else ui.step='sub';
    return render();
  }
  if(a==='sub'){ ui.sub = b.dataset.s; ui.step='compose'; return render(); }
  if(a==='idea'){
    const it = ideas()[parseInt(b.dataset.i,10)]; const ta = $('#ot');
    if(!it || !ta) return;
    if(typeof it==='string'){ ta.value = it; }
    else {
      ta.value = it.t;
      const sel = $('#otm'); if(sel) sel.value = String(it.m);
      const nr = $('#onr'); if(nr) nr.checked = !!it.nr;
      const oa = $('#oap'), ot = $('#opt');
      if(oa) oa.value = it.pen ? it.pen[1] : '';
      if(ot) ot.value = it.pen ? it.pen[0] : 'custom';
      const d = document.querySelector('details.opts'); if(d) d.open = true;
    }
    ta.focus();
    return;
  }
  if(a==='arch'){ ui = {step:'archive', cat:b.dataset.c}; return render(); }
  if(a==='pen'){ ui = {step:'pen', src:null, prev:ui}; return render(); }
  if(a==='penfor'){ ui = {step:'pen', src:b.dataset.id, prev:ui}; return render(); }
  if(a==='prs'){
    const i = parseInt(b.dataset.i,10);
    const p = i>=0 ? PACKS[pack].pen[i] : null;
    ui.step = 'pencompose';
    ui.ptipo = p ? p[0] : 'custom';
    ui.ptxt  = p ? p[1] : '';
    return render();
  }
  if(a==='back'){
    const s = ui.step;
    if(s==='compose' && CATS[ui.cat].sub.length>1) ui = {step:'sub', cat:ui.cat};
    else if(s==='pencompose') ui = {step:'pen', src:ui.src, prev:ui.prev};
    else if(s==='pen') ui = ui.prev || {step:'home'};
    else ui = {step:'home'};
    return render();
  }
  if(a==='order') return sendOrder();
  if(a==='penorder') return sendPen();
  if(a==='del') return delOrder(b.dataset.id);
  if(a==='yn') return replyChoice('yn', b.dataset.v);
  if(a==='ok') return replyChoice('ok');
  if(a==='send') return sendReply();
  if(a==='rinvia') return rinvia();
});

app.addEventListener('change', e => {
  if(e.target.id==='tf'){
    const f0 = e.target.files[0]; pendingTFile = f0 || null;
    const p0 = $('#tprev'); if(!p0) return;
    p0.innerHTML = f0 ? '<img src="'+URL.createObjectURL(f0)+'" alt="">' : '';
    return;
  }
  if(e.target.id!=='rf') return;
  const f = e.target.files[0]; pendingFile = f || null;
  const p = $('#prev'); if(!p) return;
  if(!f){ p.innerHTML=''; return; }
  const u = URL.createObjectURL(f);
  p.innerHTML = f.type.indexOf('video')===0 ? '<video src="'+u+'" controls playsinline></video>'
              : f.type.indexOf('image')===0 ? '<img src="'+u+'" alt="">'
              : '<p class="note">'+esc(f.name)+'</p>';
});

app.addEventListener('focusout', () => {
  if(!pendingRender) return;
  setTimeout(()=>{ if(pendingRender && !typing() && !locked) render(); }, 300);
});

document.addEventListener('visibilitychange', () => {
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(role && localStorage.getItem(PINKEY) && Date.now()-hiddenAt > LOCK_AFTER){
    locked = true; lockHidePopup(); unlock(()=>{ locked=false; sig=''; refresh(false).then(render).then(applyTarget).then(()=>refreshMsgs(false)).then(()=>refreshTimers(false)).then(()=>gRefresh()); });
  } else if(role){ refresh(true); refreshMsgs(true); refreshTimers(true); gRefresh(); applyTarget(); if(Date.now()-lastClock > 300000) syncClock(); }
});

const GCARDS = [];
(function buildCards(){
  const T0 = '2026-10-14T00:00:00.000Z';
  function add(mode, cat, actor, rows, sq){
    rows.forEach(function(r, i){
      const fl = r[4] || '';

        mode: mode, squareNumber: sq || null, category: cat, actor: actor,
        title: r[0], description: r[1], difficulty: r[2], estimatedDuration: r[3] || null,
        completionCriteria: G_CRIT[cat] || 'Prova completata.', enabled: true,
        tags: [cat, mode].concat(fl.indexOf('i')>=0 ? ['immaginario'] : []),
        createdAt: T0, updatedAt: T0,
        money: fl.indexOf('m')>=0, order: fl.indexOf('o')>=0, physical: fl.indexOf('p')>=0, imaginary: fl.indexOf('i')>=0
      });
    });
  }
  Object.keys(D).forEach(function(mode){
    Object.keys(D[mode]).forEach(function(cat){
      add(mode, cat, 'goddess_roll', D[mode][cat].g || []);
      add(mode, cat, 'slave_roll', D[mode][cat].s || []);
    });
    Object.keys(SYS).forEach(function(cat){
      add(mode, cat, 'goddess_roll', SYS[cat].g);
      add(mode, cat, 'slave_roll', SYS[cat].s);
    });
    Object.keys(FIX[mode]).forEach(function(sq){
      const n = parseInt(sq, 10);
      const cat = n===40 ? 'arrivo' : gBoardOf(mode)[n-1];
      add(mode, cat, 'goddess_roll', FIX[mode][sq].g, n);
      add(mode, cat, 'slave_roll', FIX[mode][sq].s, n);
    });
  });
})();

function gBoardOf(mode){
  const b = G_BASE.slice(), o = G_OVR[mode] || {};
  Object.keys(o).forEach(function(k){ b[parseInt(k,10)-1] = o[k]; });
  return b;
}
function gRand(n){
  const max = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do { crypto.getRandomValues(a); } while(a[0] >= max);
  return a[0] % n;
}
function gDie(){ return gRand(6) + 1; }
function gFill(s, text){ return String(text).replace(/\{budget\}/g, ((s.settings && s.settings.budgetMax) || 0) + '€'); }
function gOther(w){ return w==='goddess' ? 'slave' : 'goddess'; }
function gDb(w){ return w==='goddess' ? 'padrona' : 'schiavo'; }

function gPick(s, square, cat, who, excludeId){
  const budget = (s.settings && s.settings.budgetMax) || 0;
  const all = GCARDS.concat((s.settings && s.settings.customCards) || []);
  const actors = who==='goddess' ? ['goddess_roll','both'] : ['slave_roll','both'];
  function pool(fn){
    return all.filter(function(c){
      return c.enabled && (c.mode===s.mode || c.mode==='any') && actors.indexOf(c.actor)>=0 &&
             (!c.money || budget>0) && c.id!==excludeId && fn(c);
    });
  }
  let list = pool(function(c){ return c.squareNumber===square; });
  if(!list.length) list = pool(function(c){ return c.squareNumber==null && c.category===cat; });
  if(!list.length) list = pool(function(c){ return c.squareNumber==null && c.category==='vuota'; });
  const used = s.usedCards || [];
  const fresh = list.filter(function(c){ return used.indexOf(c.id) < 0; });
  const src = fresh.length ? fresh : list;
  return src[gRand(src.length)];
}

function gMakeChallenge(s, card, square, who, cat, note){
  const sys = G_SYSTEM.indexOf(cat) >= 0;
  let desc = gFill(s, card.description);
  if(note){
    if(cat==='scambio') desc += ' Nuove posizioni: Dea '+s.goddessPosition+', schiavo '+s.slavePosition+'.';
    if(cat==='bonus' && /\+/.test(note)) desc += ' ('+note+')';
  }
  return {
    id: 'c'+Date.now()+'-'+gRand(1000), cardId: card.id, square: square, squareName: G_NAMES[square] || '',
    category: cat, roller: who, mode: s.mode, title: card.title, description: desc,
    difficulty: card.difficulty, duration: card.estimatedDuration, criteria: card.completionCriteria,
    money: !!card.money, order: !!card.order, physical: !!card.physical, imaginary: !!card.imaginary, system: sys,
    status: 'assegnata', agree: {goddess:false, slave:false}, changes: 0, ordered: false, note: note || ''
  };
}

function gApplyRoll(s, die){
  const who = s.currentTurn;
  const key = who==='goddess' ? 'goddessPosition' : 'slavePosition';
  const okey = who==='goddess' ? 'slavePosition' : 'goddessPosition';
  const from = s[key];
  s.undo = {gp:s.goddessPosition, sp:s.slavePosition, turn:s.currentTurn, phase:s.phase,
    extraPending:!!s.extraPending, extraUsed:!!s.extraUsed, hist:s.turnHistory.length, dice:s.diceHistory.length,
    used:(s.usedCards||[]).length, vg:s.visited.goddess.length, vs:s.visited.slave.length, persistent:false};
  let to = from + die;
  if(to > G_SIZE) to = G_SIZE - (to - G_SIZE);
  s[key] = to;
  const cat = gBoardOf(s.mode)[to-1];
  let note = '';
  const wasExtra = !!s.extraUsed;
  s.extraUsed = false;
  if(cat==='scambio'){
    const t = s[key]; s[key] = s[okey]; s[okey] = t; note = 'scambio'; s.undo.persistent = true;
  } else if(cat==='bonus'){
    const nt = Math.min(to + 2, G_SIZE - 1);
    if(nt !== s[key]){ s[key] = nt; note = 'bonus +'+(nt-to); }
    s.undo.persistent = true;
  } else if(cat==='turno'){
    if(!wasExtra){ s.extraPending = true; note = 'tira ancora'; s.undo.persistent = true; }
  }
  const card = gPick(s, to, cat, who);
  const at = new Date().toISOString();
  s.diceHistory.push({who:who, die:die, at:at});
  s.turnHistory.push({at:at, who:who, die:die, from:from, to:s[key], square:to, category:cat, mode:s.mode,
    cardId:card.id, title:card.title, status:'assegnata', note:note});
  s.visited[who].push(to);
  s.usedCards = (s.usedCards||[]).concat([card.id]);
  s.currentChallenge = gMakeChallenge(s, card, to, who, cat, note);
  s.phase = 'challenge';
  s.lastResult = null;
  return s;
}

function gAdvance(s, status){
  const ch = s.currentChallenge;
  if(!ch) return s;
  ch.status = status;
  const h = s.turnHistory[s.turnHistory.length-1];
  if(h) h.status = status;
  s.lastResult = {who:ch.roller, title:ch.title, category:ch.category, square:ch.square, status:status};
  s.currentChallenge = null;
  s.undo = null;
  if(ch.category==='arrivo'){ s.phase = 'finale'; s.winner = ch.roller; return s; }
  if(s.extraPending){ s.extraPending = false; s.extraUsed = true; }
  else s.currentTurn = gOther(s.currentTurn);
  s.phase = 'roll';
  return s;
}

function gChangeCard(s){
  const ch = s.currentChallenge;
  if(!ch || ch.system || ch.category==='arrivo') return false;
  const budget = (s.settings && s.settings.budgetMax) || 0;
  const all = GCARDS.concat((s.settings && s.settings.customCards) || []);
  const actors = ch.roller==='goddess' ? ['goddess_roll','both'] : ['slave_roll','both'];
  let list = all.filter(function(c){
    return c.enabled && (c.mode===s.mode || c.mode==='any') && actors.indexOf(c.actor)>=0 && c.squareNumber==null &&
      c.category===ch.category && c.id!==ch.cardId && (!c.money || budget>0);
  });
  if(!list.length) return false;
  /* se la carta era intensa, preferisci una versione più leggera e non fisica */
  const lighter = list.filter(function(c){ return !c.physical && c.difficulty <= Math.max(1, ch.difficulty) ; });
  if((ch.physical || ch.difficulty>=3) && lighter.length) list = lighter;
  const fresh = list.filter(function(c){ return (s.usedCards||[]).indexOf(c.id) < 0; });
  const src = fresh.length ? fresh : list;
  const card = src[gRand(src.length)];
  ch.cardId = card.id; ch.title = card.title; ch.description = gFill(s, card.description);
  ch.difficulty = card.difficulty; ch.duration = card.estimatedDuration; ch.criteria = card.completionCriteria;
  ch.money = !!card.money; ch.order = !!card.order; ch.physical = !!card.physical; ch.imaginary = !!card.imaginary;
  ch.agree = {goddess:false, slave:false}; ch.changes = (ch.changes||0) + 1; ch.ordered = false;
  const h = s.turnHistory[s.turnHistory.length-1];
  if(h){ h.cardId = card.id; h.title = card.title; h.note = (h.note ? h.note+'; ' : '') + 'carta cambiata'; }
  s.usedCards = (s.usedCards||[]).concat([card.id]);
  if(s.undo) s.undo.persistent = true;
  return true;
}

function gCanUndo(s){
  const ch = s.currentChallenge;
  return !!(s.gameStatus==='attiva' && s.phase==='challenge' && ch && ch.status==='assegnata' && s.undo && !s.undo.persistent &&
            !ch.ordered && !ch.changes && !ch.agree.goddess && !ch.agree.slave);
}
function gUndo(s){
  const u = s.undo;
  s.goddessPosition = u.gp; s.slavePosition = u.sp; s.currentTurn = u.turn; s.phase = u.phase;
  s.extraPending = u.extraPending; s.extraUsed = u.extraUsed;
  s.turnHistory = s.turnHistory.slice(0, u.hist); s.diceHistory = s.diceHistory.slice(0, u.dice);
  s.usedCards = (s.usedCards||[]).slice(0, u.used);
  s.visited.goddess = s.visited.goddess.slice(0, u.vg); s.visited.slave = s.visited.slave.slice(0, u.vs);
  s.currentChallenge = null; s.undo = null;
  return s;
}

function gStats(s){
  const th = s.turnHistory || [];
  const uniq = function(a){ return a.filter(function(x,i){ return a.indexOf(x)===i; }).length; };
  const end = s.gameStatus==='terminata' ? new Date(s.updatedAt) : new Date();
  const ms = Math.max(0, end - new Date(s.createdAt));
  return {
    turni: th.length,
    visitateDea: uniq(s.visited.goddess), visitateSchiavo: uniq(s.visited.slave),
    completate: th.filter(function(t){ return t.status==='completata'; }).length,
    saltate: th.filter(function(t){ return t.status==='saltata'; }).length,
    minuti: Math.round(ms/60000),
    modalita: G_MODES[s.mode] ? G_MODES[s.mode].nome : s.mode
  };
}

function gNewState(cfg){
  const t = new Date().toISOString();
  let start = cfg.start;
  if(start==='random') start = gRand(2) ? 'goddess' : 'slave';
  return {
    gameId:'g'+Date.now(), participants:{goddess:'padrona', slave:'schiavo'}, mode:cfg.mode, boardSize:G_SIZE,
    goddessPosition:1, slavePosition:1, currentTurn:start, gameStatus:'attiva', phase:'roll',
    diceHistory:[], turnHistory:[], currentChallenge:null, lastResult:null, pendingPenalty:null, undo:null,
    usedCards:[], visited:{goddess:[1], slave:[1]}, extraPending:false, extraUsed:false,
    pausedBy:null, endReason:null, winner:null, finale:null,
    settings:{startRule:cfg.start, budgetMax:Math.max(0, cfg.budget||0), finalOptions:(cfg.finals && cfg.finals.length) ? cfg.finals : G_FINALS.slice(), customCards:[]},
    createdAt:t, updatedAt:t
  };
}

/* ---------- IL GIOCO DELLA DEA: INTERFACCIA E SINCRONIZZAZIONE ---------- */
let G = null, gErr = false, gBusy = false, gPanel = '', gModalOpen = true, gSeenCh = null, gLoaded = false;
let gSetup = {mode:'bdsm', start:'random', budget:0, finals:G_FINALS.join('\n')};
let gEl = null, gChannel = null, gT = null, gBoardMode = null, gOpen = true, gRuleOpen = false, gEditing = false, gLegendOpen = true;
let gForceSetup = false, gPendingRender = false, gPlacedOnce = false, gAnimating = false, gHistSeen = 0, gFab = null, gVisible = false, gIO = null;
try{ gOpen = localStorage.getItem('gd_gopen')!=='0'; gLegendOpen = localStorage.getItem('gd_gleg')!=='0'; }catch(e){}

function gMe(){ return role==='padrona' ? 'goddess' : 'slave'; }
function gWho(w){ return w==='goddess' ? 'la Dea' : 'lo schiavo'; }
function gClone(){ return JSON.parse(JSON.stringify(G.stato)); }
function gTypingIn(){
  const a = document.activeElement;
  return !!(gEl && a && gEl.contains(a) && (a.tagName==='TEXTAREA' || a.tagName==='INPUT') && String(a.value||'').trim());
}

/* ---------- Dati e sincronizzazione ---------- */
async function gLoad(){
  const r = await sb.from('partite').select('*').eq('attiva', true).order('created_at',{ascending:false}).limit(1);
  gLoaded = true;
  if(r.error){ gErr = true; return false; }
  gErr = false;
  G = (r.data && r.data[0]) ? {id:r.data[0].id, versione:r.data[0].versione, stato:r.data[0].stato} : null;
  try{ localStorage.setItem('gd_game', JSON.stringify(G)); }catch(e){}
  return true;
}
async function gSave(ns, evento, destWho){
  if(!G) return false;
  ns.updatedAt = new Date().toISOString();
  const r = await sb.rpc('gioco_salva',{p_id:G.id, p_ver:G.versione, p_stato:ns, p_evento:evento||null, p_dest:destWho ? gDb(destWho) : null});
  if(r.error){
    const msg = String(r.error.message||'');
    if(/conflitto/.test(msg)) toast("La partita è stata aggiornata dall'altro telefono");
    else if(/turno/.test(msg)) toast("Non è il tuo turno");
    else toast('Salvataggio non riuscito, riprova');
    await gLoad(); gameRender(); return false;
  }
  G.stato = ns; G.versione = r.data;
  try{ localStorage.setItem('gd_game', JSON.stringify(G)); }catch(e){}
  gameRender();
  return true;
}
async function gRefresh(){
  const prev = G ? G.versione : 0;
  if(!await gLoad()){ gameRender(); return; }
  if(G && G.versione!==prev){
    const s = G.stato;
    if(prev && s.gameStatus==='attiva' && s.phase==='roll' && s.currentTurn===gMe() && !document.hidden){ toast('È il tuo turno'); buzz(); }
  }
  if(gTypingIn()){ gPendingRender = true; return; }
  gameRender();
}
function gInit(){
  try{ const c = JSON.parse(localStorage.getItem('gd_game')||'null'); if(c && c.stato) G = c; }catch(e){}
  gameRender();
  gLoad().then(function(){ gameRender(); });
  if(gChannel) sb.removeChannel(gChannel);
  gChannel = sb.channel('partite-live').on('postgres_changes',{event:'*',schema:'public',table:'partite'},function(){
    clearTimeout(gT); gT = setTimeout(gRefresh, 250);
  }).subscribe();
}
function gReset(){
  if(gChannel){ sb.removeChannel(gChannel); gChannel = null; }
  G = null; gErr = false; gPanel = ''; gForceSetup = false;
  try{ localStorage.removeItem('gd_game'); }catch(e){}
}

/* ---------- Montaggio nella pagina ---------- */
function gEnsureEl(){
  if(gEl) return;
  gEl = document.createElement('section');
  gEl.id = 'game';
  gEl.className = 'game' + (gOpen ? ' open' : '');
  gEl.innerHTML = '<button class="ghead" data-g="toggle"><span class="gh1"><span class="gh-ic">♟</span><span>IL GIOCO DELLA DEA</span></span><span id="gHint"></span><span class="gchev">▾</span></button>'+
    '<div class="gbody"><div id="gTop"></div><div class="gboard" id="gBoard"></div><div id="gLegend"></div><div id="gBottom"></div></div><div id="gModal"></div>';
  gEl.addEventListener('click', gClick);
  gEl.addEventListener('focusout', function(){
    if(!gPendingRender) return;
    setTimeout(function(){ if(gPendingRender && !gTypingIn()){ gPendingRender = false; gameRender(); } }, 300);
  });
  if('IntersectionObserver' in window){
    gIO = new IntersectionObserver(function(en){ gVisible = en[0].isIntersecting; gFabUpdate(); }, {threshold:0.15});
    gIO.observe(gEl);
  }
}
function mountGame(){
  const slot = document.getElementById('gameSlot');
  if(!slot){ gFabUpdate(); return; }
  gEnsureEl();
  slot.appendChild(gEl);
  gameRender();
  requestAnimationFrame(function(){ gPlaceTokens(false); });
}
function gGoto(){
  gOpen = true;
  try{ localStorage.setItem('gd_gopen','1'); }catch(e){}
  if(!gEl) return;
  gameRender();
  requestAnimationFrame(function(){ gPlaceTokens(false); if(gEl.scrollIntoView) gEl.scrollIntoView({behavior:'smooth', block:'start'}); });
}
function gFabUpdate(){
  if(!gFab){
    gFab = document.createElement('button');
    gFab.className = 'gfab'; gFab.setAttribute('aria-label','Apri il Gioco della Dea'); gFab.textContent = '♟';
    gFab.style.display = 'none';
    gFab.addEventListener('click', gGoto);
    document.body.appendChild(gFab);
  }
  const s = G && G.stato;
  const active = !!s && (s.gameStatus==='attiva' || s.gameStatus==='pausa');
  const hot = !!s && s.gameStatus==='attiva' && gHot(s);
  const onHome = !!document.getElementById('gameSlot');
  gFab.style.display = (onHome && role && !locked && active && !gVisible) ? '' : 'none';
  gFab.classList.toggle('hot', hot);
}
function gHot(s){
  const m = gMe();
  return (s.phase==='roll' && s.currentTurn===m) || (s.phase==='finale' && m==='goddess');
}
function gTeaser(){
  const s = G && G.stato, m = gMe();
  let t = 'Nessuna partita in corso', sub = role==='padrona' ? 'Avviane una quando vuoi' : 'Attendi che la Dea la avvii', hot = false;
  if(gErr){ t = 'Gioco non ancora attivo'; sub = 'Serve lo script SQL v7'; }
  else if(!gLoaded && !s){ t = 'Caricamento…'; sub = ''; }
  else if(s && s.gameStatus==='attiva'){
    hot = gHot(s);
    t = hot ? 'Tocca a te!' : (s.phase==='challenge' ? 'Prova in corso' : 'Turno '+(s.currentTurn==='goddess' ? 'della Dea' : 'dello schiavo'));
    sub = G_MODES[s.mode].nome+' · Dea '+s.goddessPosition+' · schiavo '+s.slavePosition+' su 40';
  } else if(s && s.gameStatus==='pausa'){ t = 'Partita in pausa'; sub = 'Riprendete quando volete'; }
  else if(s && s.gameStatus==='terminata'){ t = 'Partita terminata'; sub = 'Apri il riepilogo'; }
  return '<button class="gteaser'+(hot ? ' hot' : '')+'" data-a="gopen"><span class="gtic">♟</span><span class="gtx"><b>IL GIOCO DELLA DEA</b><br><span>'+esc(t)+(sub ? ' · <small>'+esc(sub)+'</small>' : '')+'</span></span><span class="gtgo">'+(hot ? 'GIOCA' : '›')+'</span></button>';
}

function gHint(s){
  if(!s) return '';
